project:
  name: bob-bot
  directory: bob-bot
  version: 0.1.0
  status: planning
  tier: Production
  tech:
    - Rust
    - Axum
    - Vue 3
    - Headless Chromium (CDP)
    - SQLite
    - Docker
  current_task: 完成面向普通办公室白领的轻量助理立项与五大核心缺失技术细节架构设计（BYOK 开箱、手机网页内嵌 CDP 虚拟浏览器窗口、DOM AXTree 操控、内置 Router-Worker、示教转 Routine），下一步在所在地区 VPS 上进行自测 POC。
  development_plan: docs/CURRENT_STAGE.md

