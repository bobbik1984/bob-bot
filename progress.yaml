  - name: 🟢 原型上线与能力扩展（2026-11）
    tasks:
      - text: 一键部署脚本与构建戳（deploy-ry.sh + /api/version）
        status: done
      - text: 卡片化对话（图标/标签/对齐信息行/双按钮）与 Orb 状态动效
        status: done
      - text: 多语言切换、语音输入、会话重命名、恢复上次页面、3 小时新会话
        status: done
      - text: 文员页只保留待办/定时任务/收件箱，渠道与时区移入设置
        status: done
      - text: 官方微信 iLink 桥（扫码登录、私聊会话、提醒推送、兼容 /v1 API）
        status: done
      - text: PWA + APNs 手机主屏幕推送（Android 独立 APK 规划）
        status: done
      - text: 长期记忆、夜间做梦整合、主动关心 0–1 主动性档位
        status: done
      - text: 受控功能包（工具/路由/面板，审批与失败隔离）
        status: done
      - text: 多供应商模型档案（DeepSeek/OpenAI/Anthropic/Gemini/OpenRouter/自定义）与设置页五组导航
        status: done
