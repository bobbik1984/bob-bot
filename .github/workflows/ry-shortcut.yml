name: Sign RY iPhone shortcut
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/make-ry-shortcut.py
      - release-ry.json
      - .github/workflows/ry-shortcut.yml
permissions:
  contents: read
jobs:
  sign:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Sign blank template for distribution
        run: |
          python3 scripts/make-ry-shortcut.py "$RUNNER_TEMP/template.shortcut"
          shortcuts sign --mode anyone --input "$RUNNER_TEMP/template.shortcut" --output "$RUNNER_TEMP/交给 RY.shortcut"
          test "$(head -c 4 "$RUNNER_TEMP/交给 RY.shortcut")" = AEA1
      - uses: actions/upload-artifact@v4
        with:
          name: ry-iphone-shortcut
          path: ${{ runner.temp }}/交给 RY.shortcut
          if-no-files-found: error
