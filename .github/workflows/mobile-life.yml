name: Mobile life tests
on:
  push:
    branches: [main, prototype/mobile-life]
    paths: ['gateway/**', 'scripts/**', '.github/workflows/mobile-life.yml']
  pull_request:
    paths: ['gateway/**', 'scripts/**', '.github/workflows/mobile-life.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - working-directory: gateway
        run: |
          go test -race ./...
          go build -o "$RUNNER_TEMP/bobbot" .
      - run: |
          python3 -m venv "$RUNNER_TEMP/bob-intake-test"
          "$RUNNER_TEMP/bob-intake-test/bin/pip" install 'openpyxl>=3.1,<4'
          "$RUNNER_TEMP/bob-intake-test/bin/python" -B scripts/test_intake.py
      - run: |
          node --input-type=module --check < gateway/life/web/life.js
          node --check gateway/life/web/sw.js
          node --test gateway/life/*.test.mjs
          python3 -m py_compile scripts/deploy-life.py scripts/life_release.py scripts/deploy-gcp.py
          python3 scripts/test_deploy_gcp.py
          bash -n scripts/build-gcp.sh
          python3 -c "import runpy; print(runpy.run_path('scripts/life_release.py')['REMOTE'])" | bash -n
