<!doctype html><html><head><meta charset="utf-8"><style>
html, body { width:100%; height:100%; margin:0; overflow:hidden; }
body { display:flex; align-items:center; justify-content:flex-end; }
#badge { display:flex; align-items:center; gap:5px; max-width:100%; box-sizing:border-box; border-radius:99px; border:1px solid var(--line); background:var(--surface-2); padding:3px 8px; width:max-content; font:600 12px system-ui; }
#icon, #temp { flex:none; white-space:nowrap; }
#city { min-width:0; color:var(--muted); overflow-wrap:anywhere; }
</style></head><body><div id="badge"><span id="icon"></span><span id="temp">—</span><span id="city"></span></div><script>
const badge = document.getElementById('badge')
function fitBadge() {
  // Measure the single-line pill, then measure its height at the available width.
  badge.style.maxWidth = 'none'
  const width = Math.ceil(badge.getBoundingClientRect().width)
  badge.style.maxWidth = ''
  window.bob.resize(width, Math.ceil(badge.getBoundingClientRect().height))
}
new MutationObserver(fitBadge).observe(badge, {childList:true, subtree:true, characterData:true})
addEventListener('resize', fitBadge)
let locationKey, cityLocation, request
async function updateWeather() {
  request?.abort()
  const controller = request = new AbortController()
  const params = new URLSearchParams({latitude:cityLocation.latitude, longitude:cityLocation.longitude, current:'temperature_2m,weather_code'})
  try {
    const response = await fetch('https://api.open-meteo.com/v1/forecast?' + params,{signal:controller.signal})
    if (!response.ok) throw Error('forecast')
    const {current} = await response.json()
    if (!Number.isFinite(current.temperature_2m)) throw Error('temperature')
    if (controller.signal.aborted) return
    document.getElementById('temp').textContent = Math.round(current.temperature_2m) + '°C'
    const code = current.weather_code
    document.getElementById('icon').textContent = code === 0 ? '☀️' : code < 4 ? '☁️' : code < 50 ? '🌫️' : code >= 95 ? '⛈️' : (code >= 71 && code <= 77) || code === 85 || code === 86 ? '❄️' : '🌧️'
  } catch {
    if (!controller.signal.aborted) { document.getElementById('temp').textContent = '—'; document.getElementById('icon').textContent = '' }
  }
}
addEventListener('message', e => {
  if (e.source !== parent || e.data?.bob !== 'init') return
  const next = e.data.location || {name:'Shanghai',latitude:31.2304,longitude:121.4737}
  const key = JSON.stringify(next)
  if (key === locationKey) return
  cityLocation = next; locationKey = key
  document.getElementById('city').textContent = next.name
  document.getElementById('temp').textContent = '—'
  document.getElementById('icon').textContent = ''
  updateWeather()
})
setInterval(() => { if (cityLocation) updateWeather() }, 900000)
</script></body></html>
