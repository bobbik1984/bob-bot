<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="/life.webmanifest"><title>Bob</title>
<style>
:root{color-scheme:light dark;--paper:light-dark(#f4f4ee,#191e1b);--surface:light-dark(#fffef8,#252b26);--ink:light-dark(#202c24,#e4eadf);--muted:light-dark(#516055,#a7b4a6);--line:light-dark(#c7cfc1,#465048);--accent:light-dark(#365a45,#a7ccb0);--button:light-dark(#fcfff6,#17271c);--tint:light-dark(#e3ebdc,#303f33);scrollbar-gutter:stable;font-family:system-ui,sans-serif;color:var(--ink);background:var(--paper)}
*{box-sizing:border-box}body{max-width:780px;margin:auto;padding:24px 20px 70px}header,nav,.actions,.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}header{justify-content:space-between;padding-bottom:20px;border-bottom:1px solid var(--line)}header strong{font:600 29px Georgia,serif}h1{font:500 clamp(31px,6vw,47px)/1.16 Georgia,serif;letter-spacing:-.05em;margin:30px 0 18px}h2{font-size:19px;margin:24px 0 10px}h3{font-size:17px;margin:0 0 5px;overflow-wrap:anywhere}a,button,input,select,textarea{font:inherit}a{color:var(--accent)}button,.link{display:inline-block;border:1px solid var(--line);border-radius:9px;padding:7px 12px;background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none}button:disabled{opacity:.55}.primary{background:var(--accent);color:var(--button);border-color:var(--accent)}section form,.card,#login{border:1px solid var(--line);background:var(--surface);padding:16px;border-radius:14px}.card{margin:8px 0}.card.focus{background:var(--tint)}.muted,small,label{color:var(--muted)}.row>*{min-width:0;flex:1}label{display:block;margin:10px 0}textarea,input,select{width:100%;margin-top:4px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px;border-radius:7px}textarea{resize:vertical;min-height:65px}.actions{margin-top:10px}small{display:block;margin:4px 0}.thumb{max-height:110px;max-width:100%;border-radius:6px}summary{cursor:pointer;color:var(--muted);padding:8px 0}#msg{position:sticky;top:8px;background:var(--tint);border-radius:8px;padding:8px;z-index:1}#msg:empty,[hidden]{display:none!important}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent)}::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
</style>
<header><strong>Bob</strong><nav><button id="lang"></button><a class="link" href="/classic" data-t="classic"></a></nav></header>
<p id="msg" role="status"></p>
<form id="login" hidden><label><span data-t="pin"></span><input id="pin" required type="password" autocomplete="current-password" inputmode="numeric"></label><button class="primary" data-t="enter"></button></form>
<main id="app" hidden><h1 data-t="heading"></h1>
<section id="attention" aria-live="polite"><div id="notices"></div></section>
<section><form id="capture"><label><span data-t="capture"></span><textarea maxlength="1200" id="note"></textarea></label>
<div class="row"><label><span data-t="kind"></span><select id="kind"><option value="wish" data-t="wish"></option><option value="save" data-t="save"></option><option value="plan" data-t="plan"></option></select></label>
<label><span data-t="image"></span><input type="file" id="photo" accept="image/*"></label></div>
<details id="details"><summary data-t="details"></summary><div class="row"><label><span data-t="where"></span><input maxlength="60" id="place"></label><label><span id="whenLabel"></span><input id="when" type="datetime-local"></label></div></details>
<small id="filehint"></small><div class="actions"><button class="primary" id="submit" data-t="submit"></button><button type="button" id="read" data-t="read"></button></div><small data-t="readhint"></small></form></section>
<h2 data-t="watching"></h2><div id="open"></div><details><summary data-t="history"></summary><div id="closed"></div></details>
<div class="actions"><button id="push" data-t="push"></button><button id="signout" data-t="signout"></button></div></main>
<script type="module" src="/life-ui.js"></script></html>
