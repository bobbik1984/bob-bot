<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f4f6fb">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bob">
<title>Bob</title>
<script>
// Decide light or dark before the first paint, so the page never flashes the wrong one.
(() => {
  const system = matchMedia('(prefers-color-scheme: dark)')
  const apply = () => {
    let choice = 'auto'
    try { choice = localStorage.getItem('bobbot.theme') || 'auto' } catch { /* private mode */ }
    const dark = choice === 'dark' || (choice === 'auto' && system.matches)
    document.documentElement.dataset.theme = dark ? 'dark' : 'light'
    document.querySelector('meta[name=theme-color]').content = dark ? '#0e1117' : '#f5f6fa'
    document.querySelector('meta[name=color-scheme]').content = dark ? 'dark' : 'light'
  }
  window.applyTheme = apply
  apply()
  system.addEventListener('change', apply)
})()
</script>
<style>
:root {
  color-scheme: light;
  --bg:#f5f6fa; --surface:#ffffff; --surface-2:#eef0f6; --surface-3:#e2e6ef; --text:#171c28; --muted:#667085; --line:#e4e7ee;
  --accent:#2f6bff; --accent-text:#ffffff; --accent-soft:#e8efff; --accent-ink:#2152cc; --bubble-user:#2f6bff; --bubble-user-text:#ffffff;
  --danger:#d64545; --danger-soft:#fdeceb; --ok:#1f9d6b; --ok-soft:#e3f6ee; --warn:#a96a12; --warn-soft:#fff3dc;
  --shadow-1:0 1px 2px rgba(16,24,40,.05); --shadow:0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.06); --shadow-pop:0 12px 40px rgba(16,24,40,.16);
  --shade:rgba(15,23,42,.45); --stage:#0b0f1a; --canvas:#ffffff;
  --ease:cubic-bezier(.2,.8,.2,1);
}
html[data-theme=dark] {
  color-scheme: dark;
  --bg:#0e1117; --surface:#161a22; --surface-2:#1f242e; --surface-3:#2b313d; --text:#e8ebf2; --muted:#98a2b3; --line:#272d39;
  --accent:#4b7dff; --accent-soft:#1a2748; --accent-ink:#a3bcff; --bubble-user:#3a66e0;
  --danger:#f0736f; --danger-soft:#3a1c1e; --ok:#4cc38a; --ok-soft:#143024; --warn:#e3ad52; --warn-soft:#33280f;
  --shadow-1:0 1px 2px rgba(0,0,0,.4); --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35); --shadow-pop:0 12px 40px rgba(0,0,0,.6);
  --shade:rgba(0,0,0,.6); --stage:#05070b;
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; margin:0; }
body { background:var(--bg); color:var(--text); font:16px/1.55 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
button, input, select, textarea { font:inherit; color:inherit; }
button { cursor:pointer; border:0; background:none; padding:0; }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
svg { width:1.25em; height:1.25em; flex:none; }
[hidden] { display:none !important; }

.btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px; padding:0 18px; border-radius:14px; background:var(--surface-2); font-weight:600; }
.btn.small { min-height:36px; padding:0 14px; font-size:14px; border-radius:12px; }
.btn.primary { background:var(--accent); color:var(--accent-text); }
.btn.danger { background:var(--danger-soft); color:var(--danger); }
.btn.block { width:100%; }
.icon-btn { width:40px; height:40px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; color:var(--muted); }
.icon-btn:active, .btn:active { transform:scale(.97); }
.link { color:var(--accent-ink); font-weight:600; padding:6px 4px; }
.field { width:100%; min-width:0; min-height:44px; padding:0 14px; border-radius:14px; border:1px solid var(--line); background:var(--surface); }

/* the Bob orb: napping, thinking, speaking */
.orb { --s:28px; --ring:calc(var(--s) * .14); position:relative; width:var(--s); height:var(--s); flex:none; display:inline-block; font-size:var(--s); }
.orb.big { --s:84px; }
.orb i { position:absolute; inset:0; border-radius:50%; pointer-events:none; }
/* a flat, solid ring: no gradient, no shading, no shadow */
.orb .core { background:transparent; border:var(--ring) solid var(--accent); box-sizing:border-box; }
.orb .ring { inset:0; opacity:0; border:var(--ring) solid transparent; border-top-color:var(--accent); border-radius:50%; }
.orb .wave { border:calc(var(--s) * .03) solid var(--accent); opacity:0; }
.orb[data-state=nap] .core { animation:nap 5s ease-in-out infinite; opacity:.55; }
.orb[data-state=think] .core { opacity:.22; }
.orb[data-state=think] .ring { opacity:1; animation:spin 1.2s linear infinite; }
.orb[data-state=speak] .core { animation:talk .9s ease-in-out infinite; }
.orb[data-state=speak] .wave { animation:ripple 1.5s ease-out infinite; }
.orb[data-state=speak] .wave.w2 { animation-delay:.55s; }
.orb.static .core { animation:none !important; filter:none; box-shadow:none; }

/* the three moods are drawn around the circle itself, never as words in the header */
.orb .fx { position:absolute; inset:0; display:none; pointer-events:none; }
.orb .fx b { display:block; }
.orb[data-state=nap] .fx.napfx, .orb[data-state=speak] .fx.sayfx { display:block; }
.orb[data-state=think] .fx.thinkfx { display:flex; }

/* napping: soft bubbles drift up from the circle */
.fx.napfx b { position:absolute; left:64%; top:54%; width:.14em; height:.14em; border-radius:50%; background:var(--accent); opacity:0; animation:napb 3.4s ease-in-out infinite; }
.fx.napfx b:nth-child(2) { width:.09em; height:.09em; animation-delay:1.15s; }
.fx.napfx b:nth-child(3) { width:.18em; height:.18em; animation-delay:2.3s; }
@keyframes napb { 0% { transform:translate(0,0) scale(.55); opacity:0; } 22% { opacity:.5; } 100% { transform:translate(.5em,-.78em) scale(1.25); opacity:0; } }

/* thinking: a small cloud above the head, with a trail down to it */
.fx.thinkfx { position:absolute; inset:auto; left:56%; bottom:104%; width:.62em; height:.3em; border-radius:.2em; background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow-1); align-items:center; justify-content:center; gap:.09em; animation:cloudin .5s ease-out both; }
.fx.thinkfx::before, .fx.thinkfx::after { content:''; position:absolute; border-radius:50%; background:var(--surface); border:1px solid var(--line); }
.fx.thinkfx::before { width:.1em; height:.1em; left:.08em; bottom:-.15em; }
.fx.thinkfx::after { width:.06em; height:.06em; left:.02em; bottom:-.26em; }
.fx.thinkfx b { width:.07em; height:.07em; border-radius:50%; background:var(--accent); animation:thinkdot 1.25s ease-in-out infinite; }
.fx.thinkfx b:nth-child(2) { animation-delay:.16s; }
.fx.thinkfx b:nth-child(3) { animation-delay:.32s; }
@keyframes thinkdot { 0%,100% { opacity:.28; transform:translateY(0); } 40% { opacity:1; transform:translateY(-.06em); } }
@keyframes cloudin { from { opacity:0; transform:translateY(.12em) scale(.8); } to { opacity:1; transform:none; } }

#app:not(.hero) .orb-btn .fx.thinkfx { inset:auto; left:106%; bottom:2%; width:1.5em; height:.7em; }
#app:not(.hero) .orb-btn .fx.thinkfx::before { left:-.16em; bottom:.16em; width:.16em; height:.16em; }
#app:not(.hero) .orb-btn .fx.thinkfx::after { left:-.3em; bottom:0; width:.1em; height:.1em; }

/* speaking: little words leave the mouth and fade away */
.fx.sayfx b { position:absolute; left:48%; bottom:6%; width:.14em; height:.14em; border-radius:50%; background:var(--accent); opacity:0; animation:sayb 1.15s ease-out infinite; }
.fx.sayfx b:nth-child(1) { --dx:.5em; }
.fx.sayfx b:nth-child(2) { --dx:.72em; width:.11em; height:.11em; animation-delay:.22s; }
.fx.sayfx b:nth-child(3) { --dx:.38em; animation-delay:.44s; }
.fx.sayfx b:nth-child(4) { --dx:.9em; width:.16em; height:.16em; animation-delay:.66s; }
@keyframes sayb { 0% { transform:translate(0,0) scale(.4); opacity:0; } 15% { opacity:.95; } 100% { transform:translate(var(--dx),-.62em) scale(1.1); opacity:0; } }

@keyframes nap { 0%,100% { transform:scale(.94); opacity:.4; } 50% { transform:scale(1); opacity:.6; } }
@keyframes think { 0%,100% { transform:scale(.92); } 50% { transform:scale(1.04); } }
@keyframes talk { 0%,100% { transform:scale(1); } 50% { transform:scale(1.04); } }
@keyframes ripple { 0% { transform:scale(1); opacity:.55; } 100% { transform:scale(1.9); opacity:0; } }
@keyframes spin { to { transform:rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  .orb i, .orb .fx, .orb .fx b { animation:none !important; }
  .orb .fx { display:none !important; }
  .orb[data-state=think] .ring { opacity:.9; }
  .orb[data-state=speak] .wave { opacity:.4; transform:scale(1.35); }
  .typing i { animation:none !important; opacity:.7 !important; }
  .orb-btn { transition:none !important; }
}

/* login */
#login { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:16px; }
#login .sub { margin:0; color:var(--muted); font-size:14px; }
.dots { display:flex; gap:16px; margin-top:10px; }
.dots i { width:14px; height:14px; border-radius:50%; border:2px solid var(--line); background:var(--surface); transition:background .12s, border-color .12s; }
.dots i.on { background:var(--accent); border-color:var(--accent); }
#loginMsg { min-height:24px; color:var(--danger); font-size:14px; text-align:center; max-width:300px; }
.pad { display:grid; grid-template-columns:repeat(3,72px); gap:14px 18px; }
.pad button { height:72px; border-radius:50%; font-size:26px; background:var(--surface); box-shadow:var(--shadow); border:1px solid var(--line); }
.pad button:active { background:var(--accent-soft); }
.pad .ghost { background:transparent; box-shadow:none; border-color:transparent; font-size:15px; color:var(--muted); }

/* app shell: one orb that is the hero on the front page and the menu button once a chat has started */
#app { height:100%; height:100dvh; display:flex; flex-direction:column; max-width:720px; margin:0 auto; background:var(--bg); position:relative; overflow:hidden; }
.orb-btn { position:absolute; z-index:2; padding:0; border-radius:50%; width:34px; height:34px; left:12px; top:calc(env(safe-area-inset-top) + 9px);
  transition:left .6s cubic-bezier(.22,.8,.2,1), top .6s cubic-bezier(.22,.8,.2,1), width .6s cubic-bezier(.22,.8,.2,1), height .6s cubic-bezier(.22,.8,.2,1); }
.orb-btn .orb { width:100%; height:100%; --s:34px; }
#app.hero .orb-btn .orb { --s:132px; }
#app.hero .orb-btn { width:132px; height:132px; left:calc(50% - 66px); top:calc(env(safe-area-inset-top) + 15vh); }
header { display:grid; grid-template-columns:minmax(56px,auto) 1fr minmax(56px,auto); align-items:center; padding:calc(8px + env(safe-area-inset-top)) 8px 8px; min-height:56px; }
header .title { text-align:center; font-size:16px; font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
header .right { justify-self:end; display:flex; align-items:center; gap:6px; padding-right:4px; }
main { flex:1; min-height:0; position:relative; }
.view { position:absolute; inset:0; overflow-y:auto; scrollbar-gutter:stable; padding:6px 14px 14px; }

/* chat */
#welcome { display:flex; flex-direction:column; align-items:center; gap:6px; padding:calc(15vh + 112px) 0 8px; text-align:center; }
#welcome span.s { color:var(--muted); font-size:15px; }
#welcome h1 { margin:0; font-size:26px; line-height:1.25; font-weight:700; letter-spacing:-.01em; }
#glance { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:14px; }
.glance-item { display:inline-flex; align-items:baseline; gap:6px; padding:8px 14px; border-radius:14px; background:var(--surface); border:1px solid var(--line); font-size:13px; color:var(--muted); box-shadow:var(--shadow-1); }
.glance-item b { font-size:16px; color:var(--text); }
.glance-item.warn { background:var(--warn-soft); border-color:transparent; color:var(--warn); }
.glance-item.warn b { color:var(--warn); }
.chips { display:grid; grid-template-columns:1fr; gap:10px; width:100%; max-width:600px; margin-top:22px; }
@media (min-width:560px) { .chips { grid-template-columns:repeat(3,1fr); } }
.chip-btn { display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:18px; background:var(--surface); border:1px solid var(--line); font-size:14px; font-weight:600; box-shadow:var(--shadow-1); text-align:left; }
html.fine .chip-btn:hover { border-color:var(--accent); box-shadow:var(--shadow); transform:translateY(-1px); }
.chipicon { width:36px; height:36px; border-radius:12px; display:inline-flex; align-items:center; justify-content:center; background:var(--accent-soft); color:var(--accent-ink); flex:none; }
.chipicon svg { width:18px; height:18px; }
#feed { display:flex; flex-direction:column; gap:10px; }
.bubble-row { display:flex; gap:8px; align-items:flex-end; }
.bubble-row.user { justify-content:flex-end; }
.bubble-row .spacer { width:28px; flex:none; }
.msg { max-width:84%; padding:10px 14px; border-radius:20px; white-space:pre-wrap; overflow-wrap:anywhere; background:var(--surface); border:1px solid var(--line); border-bottom-left-radius:6px; box-shadow:var(--shadow-1); }
.bubble-row.user .msg { background:var(--bubble-user); color:var(--bubble-user-text); border-color:transparent; box-shadow:none; border-bottom-left-radius:20px; border-bottom-right-radius:6px; }
.typing { display:flex; gap:5px; padding:14px 16px; }
.typing i { width:7px; height:7px; border-radius:50%; background:var(--muted); opacity:.45; animation:blink 1.2s infinite; }
.typing i:nth-child(2) { animation-delay:.2s; } .typing i:nth-child(3) { animation-delay:.4s; }
@keyframes blink { 40% { opacity:1; transform:translateY(-2px); } }
.steps { margin-left:36px; font-size:13px; color:var(--muted); background:var(--surface-2); border-radius:14px; padding:2px 12px; max-width:84%; }
.steps summary { cursor:pointer; padding:8px 0; list-style:none; display:flex; align-items:center; gap:8px; }
.steps summary::-webkit-details-marker { display:none; }
.steps summary svg { width:1em; height:1em; }
.steps ul { margin:0 0 8px; padding:0 0 0 22px; }
.notice { font-size:13px; color:var(--muted); text-align:center; padding:2px 8px; }
.notice.err { color:var(--danger); background:var(--danger-soft); border-radius:12px; padding:8px 12px; }
.fileline { display:flex; align-items:center; gap:6px; margin-top:6px; font-size:13px; color:var(--muted); }
.fileline svg { width:1em; height:1em; }
#banner { display:flex; align-items:center; gap:8px; margin:0 12px 6px; padding:9px 14px; border-radius:14px; background:var(--warn-soft); color:var(--warn); font-size:14px; font-weight:600; text-align:left; }
#banner svg { width:1.1em; height:1.1em; }

/* cards: one clean block, aligned rows, actions at the bottom */
.card { background:var(--surface); border:1px solid var(--line); border-radius:22px; padding:16px; display:flex; flex-direction:column; gap:12px; box-shadow:var(--shadow); }
.card-top { display:flex; align-items:center; gap:10px; }
.card-top .chipicon { width:36px; height:36px; border-radius:12px; display:inline-flex; align-items:center; justify-content:center; background:var(--accent-soft); color:var(--accent-ink); flex:none; }
.card-top .chipicon svg { width:18px; height:18px; }
.card.help .chipicon { background:var(--warn-soft); color:var(--warn); }
.tag { font-size:12px; font-weight:600; color:var(--accent-ink); background:var(--accent-soft); padding:4px 10px; border-radius:999px; white-space:nowrap; }
.card.help .tag { color:var(--warn); background:var(--warn-soft); }
.card .time { margin-left:auto; font-size:12px; color:var(--muted); flex:none; }
.card .lead { color:var(--muted); font-size:14px; }
.card .what { font-size:17px; font-weight:700; line-height:1.4; overflow-wrap:anywhere; }
.card .where { font-size:13px; color:var(--muted); overflow-wrap:anywhere; margin-top:-6px; }
.card .rows { display:flex; flex-direction:column; gap:8px; }
.card .kv { display:flex; align-items:baseline; justify-content:space-between; gap:16px; font-size:14px; }
.card .kv .k { color:var(--muted); flex:none; }
.card .kv .v { font-weight:600; text-align:right; overflow-wrap:anywhere; }
.card .quote { margin:0; padding:12px 14px; border-radius:14px; background:var(--surface-2); font-size:14px; line-height:1.55; white-space:pre-wrap; overflow-wrap:anywhere; max-height:160px; overflow:auto; }
.card pre.detail { margin:0; padding:10px 12px; border-radius:12px; background:var(--surface-2); font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; white-space:pre-wrap; overflow-wrap:anywhere; max-height:180px; overflow:auto; }
.card img { width:100%; max-height:240px; object-fit:contain; border-radius:12px; background:var(--stage); }
.card .actions { display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:10px; }
.card .actions .btn { width:100%; min-height:42px; border-radius:14px; }
.card .actions .link { justify-self:start; }
.card .done { display:flex; align-items:center; gap:6px; color:var(--ok); font-weight:600; font-size:14px; }
.card .done.no { color:var(--muted); }
.card.saved .tag { background:var(--ok-soft); color:var(--ok); }
.card.saved .chipicon { background:var(--ok-soft); color:var(--ok); }

/* to-dos and formatted replies */
.todo-row { display:flex; gap:12px; align-items:flex-start; }
.todo-body { flex:1; min-width:0; }
.todo-body .meta { font-size:13px; color:var(--muted); }
.check { width:28px; height:28px; border-radius:50%; border:2px solid var(--line); color:transparent; display:inline-flex; align-items:center; justify-content:center; flex:none; margin-top:1px; }
.check svg { width:16px; height:16px; }
.check.on { background:var(--ok); border-color:var(--ok); color:var(--accent-text); }
.card.todo.finished .what { text-decoration:line-through; color:var(--muted); }
.card.todo .rm { color:var(--muted); }
.msg.md { white-space:normal; }
.msg.md p { margin:0 0 6px; }
.msg.md p:last-child { margin:0; }
.md-list { margin:4px 0 6px; padding-left:20px; }
.msg.md code { background:var(--surface-2); padding:1px 5px; border-radius:6px; font-size:.9em; }
.card pre.detail.soft { font:14px/1.5 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }

/* cards Bob asks for: organized information */
.card.info .what { font-size:17px; }
.card.info .where { margin-top:0; font-size:13px; }
.info-fields { display:grid; grid-template-columns:minmax(72px,auto) 1fr; gap:6px 14px; font-size:14px; }
.info-fields .k { color:var(--muted); }
.info-fields .v { font-weight:600; overflow-wrap:anywhere; }
.info-items { list-style:none; margin:0; padding:0; font-size:14px; display:flex; flex-direction:column; gap:8px; }
.info-items li { position:relative; padding-left:16px; }
.info-items li::before { content:''; position:absolute; left:2px; top:.55em; width:5px; height:5px; border-radius:50%; background:var(--accent); }
.inbox-item .card { box-shadow:none; margin-top:10px; background:var(--surface-2); border-color:transparent; }

/* friendly cards: a saved schedule, a to-do, and the card that asks to confirm one */
.card.saved { border-color:var(--line); }
.card.saved .chipicon, .card.saved .tag { background:var(--ok-soft); color:var(--ok); }
.card .what.big { font-size:18px; line-height:1.35; }
.card .when { display:flex; align-items:center; gap:6px; font-size:13px; color:var(--muted); margin-top:-4px; }
.card .when svg { width:1em; height:1em; }
.card .quote { margin:0; padding:10px 12px; border-radius:14px; background:var(--surface-2); font-size:14px; line-height:1.5; white-space:pre-wrap; overflow-wrap:anywhere; max-height:150px; overflow:auto; }
.card .quote.said { font-size:15px; }
.card .chiplist .mini { background:var(--accent-soft); color:var(--accent-ink); }
.card .today { background:var(--ok-soft); color:var(--ok); }

/* clerk */
.sect-head { display:flex; align-items:center; justify-content:space-between; margin:18px 2px 8px; }
.sect-head h3 { margin:0; font-size:15px; }
.sect-head .link { font-size:13px; }
#jobList, #inboxList, #channelList { display:flex; flex-direction:column; gap:10px; }
.job .what { font-size:16px; }
.job .meta { font-size:13px; color:var(--muted); }
.job .meta b { color:var(--text); font-weight:600; }
.job .last { font-size:13px; color:var(--muted); display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
.job .last.failed { color:var(--danger); }
.job .last.warn { color:var(--warn); }
.job .assist { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 12px; border-radius:10px; background:var(--warn-soft); color:var(--warn); font-size:14px; }
.job .assist .btn { flex:none; }
.job .runs summary { cursor:pointer; font-size:13px; color:var(--muted); }
.job .run { display:grid; grid-template-columns:auto 1fr; gap:2px 8px; padding:8px 0; border-top:1px solid var(--line); font-size:13px; color:var(--muted); }
.job .run b { color:var(--ok); font-weight:600; }
.job .run b.warn { color:var(--warn); }
.job .run b.failed { color:var(--danger); }

// ---- the orb: napping, thinking, speaking ----
let runningCid = null, speakUntil = 0, speakTimer = null
function refreshOrb() {
  const mine = Boolean(runningCid) && runningCid === activeCid
  const state = Date.now() < speakUntil ? 'speak' : mine ? 'think' : 'nap'
  const mood = t(state === 'nap' ? 'stateNap' : state === 'think' ? 'stateThink' : 'stateSpeak')
  document.querySelectorAll('[data-orb]').forEach(orb => { orb.dataset.state = state; orb.setAttribute('aria-label', mood) })
  // The mood is drawn by the orb itself, so the header stays quiet.
  $('title').textContent = currentView === 'chat' ? '' : t(currentView === 'clerk' ? 'clerkTitle' : 'settingsTitle')
  typing.hidden = !mine
  if (mine) { feed.append(typing); follow() }
}
function speak(text) {
  const ms = Math.min(5000, 1200 + text.length * 25)
  speakUntil = Date.now() + ms
  refreshOrb()
  clearTimeout(speakTimer)
  speakTimer = setTimeout(refreshOrb, ms + 50)
}

function stamp(at) {
  if (!at) return
  const day = d => new Date(d).toDateString()
  if (at - lastStamp > 30 * 60e3 || day(at) !== day(lastStamp)) {
    const time = new Date(at).toLocaleTimeString(zh ? 'zh-CN' : 'en-US', { hour: '2-digit', minute: '2-digit', hourCycle: 'h23' })
    const date = day(at) === day(Date.now()) ? '' : day(at) === day(Date.now() - 86400e3) ? t('yesterday') : new Date(at).toLocaleDateString(zh ? 'zh-CN' : 'en-US', { month: 'short', day: 'numeric' })
    feed.insertBefore(el('div', 'daymark', `${date} ${time}`.trim()), typing)
    lastKind = null
  }
  lastStamp = at
}

function inlineMd(node, s) {
  for (const part of s.split(/(\*\*[^*]+\*\*|`[^`]+`)/)) {
    if (!part) continue
    if (part.startsWith('**')) node.append(el('strong', '', part.slice(2, -2)))
    else if (part.startsWith('`')) node.append(el('code', '', part.slice(1, -1)))
    else node.append(document.createTextNode(part))
  }
}
function renderMd(parent, text) { // bold, code, bullets and headings only, built without innerHTML
  let list = null
  for (const line of text.split('\n')) {
    const bullet = /^\s*[-*]\s+(.*)$/.exec(line)
    if (bullet) { if (!list) { list = el('ul', 'md-list'); parent.append(list) } const li = el('li'); inlineMd(li, bullet[1]); list.append(li); continue }
    list = null
    if (!line.trim()) continue
    const p = el('p'); inlineMd(p, line.replace(/^#{1,6}\s+/, '')); parent.append(p)
  }
}
function message(role, text, files = []) {

// ---- schedules, in the user's language ----
const DAYS = [['日','一','二','三','四','五','六'], ['Sun','Mon','Tue','Wed','Thu','Fri','Sat']]
function describeSchedule(s) {
  if (zh) {
    if (s.type === 'daily') return `每天 ${s.time}`
    if (s.type === 'weekly') return `每周${s.days.map(d => DAYS[0][d]).join('、')} ${s.time}`
    if (s.type === 'monthly') return `每月 ${s.day} 日 ${s.time}`
    return `仅一次 ${s.at.replace('T', ' ')}`
  }
  if (s.type === 'daily') return `Every day at ${s.time}`
  if (s.type === 'weekly') return `Every ${s.days.map(d => DAYS[1][d]).join(', ')} at ${s.time}`
  if (s.type === 'monthly') return `Monthly on day ${s.day} at ${s.time}`
  return `Once, ${s.at.replace('T', ' ')}`
}
const fmtWhen = (ms, tz) => new Intl.DateTimeFormat(zh ? 'zh-CN' : 'en-US', { timeZone: tz, month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(ms)

// Friendly times: "today 15:00", "tomorrow 09:00", otherwise a short date, always in the owner's zone.
const dayKey = (ms, tz) => new Intl.DateTimeFormat('en-CA', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit' }).format(ms)
const hmText = (ms, tz) => new Intl.DateTimeFormat('en-GB', { timeZone: tz, hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(ms)
const dateText = (ms, tz) => new Intl.DateTimeFormat(zh ? 'zh-CN' : 'en-US', { timeZone: tz, month: 'short', day: 'numeric' }).format(ms)
function whenText(ms, tz) {
  const shift = Math.round((Date.parse(dayKey(ms, tz)) - Date.parse(dayKey(Date.now(), tz))) / 86400000)
  const hm = hmText(ms, tz)
  if (shift === 0) return `${t('today')} ${hm}`
  if (shift === 1) return `${t('tomorrow')} ${hm}`
  if (shift === 2) return `${t('dayAfter')} ${hm}`
  return `${dateText(ms, tz)} ${hm}`
}
function dueText(due, tz) {
  const [day, hm] = due.split('T')
  const shift = Math.round((Date.parse(day) - Date.parse(dayKey(Date.now(), tz))) / 86400000)
  if (shift === 0) return `${t('today')} ${hm}`
  if (shift === 1) return `${t('tomorrow')} ${hm}`
  if (shift === 2) return `${t('dayAfter')} ${hm}`
  return `${dateText(Date.parse(day + 'T12:00:00Z'), tz)} ${hm}`
}

const tile = name => { const ic = el('span', 'chipicon'); ic.innerHTML = icon(name); return ic }
const kv = (label, value) => { const row = el('div', 'kv'); row.append(el('span', 'k', label), el('span', 'v', value)); return row }
const rowsOf = pairs => {
  const box = el('div', 'rows')

  return box
}
function todoCard(todo, tz, created = false) {
  const c = el('div', 'card todo' + (todo.done ? ' finished' : '') + (created ? ' saved' : ''))
  const top = el('div', 'card-top')
  const tag = el('span', 'tag', todo.done ? t('tagDone') : created ? t('tagSaved') : t('kindTodo'))
  top.append(tile('check'), tag)
  c.append(top, el('div', 'what', todo.title))
  const rows = rowsOf([[t('whenLabel'), todo.due ? dueText(todo.due, tz) : ''], [t('noteLabel'), todo.note]])
  if (rows.children.length) c.append(rows)
  const actions = el('div', 'actions')
  const done = el('button', 'btn' + (todo.done ? '' : ' primary'), t(todo.done ? 'undo' : 'markDone'))
  done.onclick = async () => {
    const r = await post('/api/clerk/todo/toggle', { id: todo.id, done: !todo.done })
    if (r.status !== 200) return
    todo.done = !todo.done
    c.classList.toggle('finished', todo.done)
    done.textContent = t(todo.done ? 'undo' : 'markDone')
    done.className = 'btn' + (todo.done ? '' : ' primary')
    tag.textContent = todo.done ? t('tagDone') : t('kindTodo')
  }
  const rm = el('button', 'btn danger', t('remove'))
  rm.onclick = async () => { const r = await post('/api/clerk/todo/delete', { id: todo.id }); if (r.status === 200) c.remove() }
  actions.append(done, rm)
  c.append(actions)
  return c
}
function infoCard(card) {
  const c = el('div', 'card info')
  const top = el('div', 'card-top')
  top.append(tile('list'))
  if (card.tag) top.append(el('span', 'tag', card.tag))
  c.append(top, el('div', 'what', card.title))
  if (card.subtitle) c.append(el('div', 'lead', card.subtitle))
  if (card.fields?.length) {

    for (const f of card.fields) rows.append(kv(f.label, f.value))

  if (card.items?.length) {
    const list = el('ul', 'info-items')
    for (const item of card.items) list.append(el('li', '', item))

  }
  if (card.note) c.append(el('div', 'where', card.note))
  return c
}

// ---- cards ----
const ACTIONS = { command:'actCommand', read:'actRead', list:'actList', write:'actWrite' }
const baseName = p => String(p).split('/').filter(Boolean).pop() ?? p
function cardTitle(e) {
  if (e.kind === 'command') return [t('actCommand')]
  if (ACTIONS[e.kind]) return [`${t(ACTIONS[e.kind])}: ${baseName(e.target)}`]
  if (e.kind === 'install') return [`${t('actInstall')}: ${e.packages?.join(', ')}`]
  if (e.kind === 'mcp') return [`${t(e.action === 'remove' ? 'actMcpRemove' : 'actMcpAdd')}: ${e.target}`]
  if (e.kind === 'skill') return [`${t(e.action === 'remove' ? 'actSkillRemove' : 'actSkillAdd')}: ${e.target}`]
  if (e.kind === 'clerk') {
    const verb = e.action === 'create' ? t(e.jobKind === 'task' ? 'actTask' : 'actReminder') : t({ delete: 'actClerkDelete', pause: 'actClerkPause', resume: 'actClerkResume' }[e.action])
    const lines = [`${verb}: ${e.target}`]
    if (e.schedule) lines.push(`${describeSchedule(e.schedule)} · ${e.timezone ?? ''}`.trim())
    if (e.firstRun) lines.push(t('firstRun', fmtWhen(e.firstRun, e.timezone)))
    if (e.to) lines.push(t('sendTo', e.to.replace('in-app inbox', t('toApp'))))
    return lines
  }
  return [actionText(e.summary)]
}
/** The server describes page actions in English. Show them in the reader's language. */
function actionText(summary) {
  let m
  if ((m = /^Click "(.*)"$/.exec(summary))) return t('actClick', m[1])
  if ((m = /^Enter "(.*)" and press Enter$/.exec(summary))) return t('actTypeEnter', m[1])
  if ((m = /^Write file (.*)$/.exec(summary))) return `${t('actWrite')}: ${baseName(m[1])}`
  if (summary === 'Run a command') return t('actCommand')
  if (summary === 'Press Enter on this page') return t('actPressEnter')
  return summary
}
let toastTimer
function toast(text, bad = false) {
  const box = $('toast')
  box.hidden = true // restart the entrance when one toast replaces another
  box.textContent = text
  box.className = bad ? 'bad' : ''
  void box.offsetWidth
  box.hidden = false
  clearTimeout(toastTimer)
  toastTimer = setTimeout(() => { box.hidden = true }, 2800)
}
function buildCard(e, kind) {
  const c = el('div', 'card ' + (kind === 'approval' ? 'ask' : 'help'))
  const top = el('div', 'card-top')
  const ic = el('span', 'chipicon'); ic.innerHTML = icon(kind === 'takeover' ? 'hand' : e.kind === 'command' ? 'terminal' : e.kind === 'clerk' ? 'clock' : /install|mcp|skill/.test(e.kind ?? '') ? 'box' : 'shield')
  top.append(ic, el('span', 'tag', t(kind === 'approval' ? 'tagApprove' : 'tagHelp')),
    el('span', 'time', new Date(e.at).toLocaleTimeString(zh ? 'zh-CN' : 'en-US', { hour: '2-digit', minute: '2-digit', hourCycle: 'h23' })))
  c.append(top)
  if (kind === 'takeover') c.append(el('div', 'lead', t('needsYou')))
  if (kind === 'takeover') c.append(el('div', 'what', e.reason))
  else if (e.kind === 'clerk') {
    // A reminder or a scheduled task: the words, and when it happens in plain language. No ids, no zone names.
    const verb = e.action === 'create' ? '' : t({ delete: 'askDelete', pause: 'askPause', resume: 'askResume' }[e.action])
    c.append(el('div', 'what', verb ? `${verb}「${e.target}」` : e.target))
    c.append(rowsOf([
      [t('repeatLabel'), describeSchedule(e.schedule)],
      [t('firstAtLabel'), e.firstRun ? whenText(e.firstRun, e.timezone) : ''],
      [t('sendLabel'), e.channels?.length ? e.channels.join('、') : t('appInbox')],
    ]))
    if (e.detail) c.append(el('div', 'quote', e.detail))
  }
  else { const [first, ...rest] = cardTitle(e); c.append(el('div', 'what', first)); for (const line of rest) if (line) c.append(el('div', 'where', line)) }
  // Show what matters to the owner: the words to be saved, or the command itself. Paths, sizes and package commands stay out of sight.
  let detail = e.detail
  if (e.kind === 'clerk') detail = '' // already shown as a quote above
  else if (e.kind === 'write') detail = (e.detail ?? '').split('\n').slice(1).join('\n').replace(/^#+\s*/gm, '').replace(/\*\*/g, '')
  else if (e.kind === 'mcp' && e.action === 'add') detail = (e.detail ?? '').split('\n').slice(1).join('\n')
  else if (e.kind === 'install' || e.kind === 'read' || e.kind === 'list') detail = ''
  if (detail) c.append(el('pre', 'detail' + (e.kind === 'command' ? '' : ' soft'), detail))
  if (e.screenshot) { const img = new Image(); img.alt = ''; img.src = 'data:image/jpeg;base64,' + e.screenshot; c.append(img) }
  const row = el('div', 'actions')
  if (kind === 'approval') {
    const go = async allow => {
      const { status } = await post('/api/approve', { id: e.id, allow })
      if (status === 404) closeCard(e.id, t('expired'), false)
    }
    const no = el('button', 'btn', t('cancel')); no.onclick = () => go(false)
    const yesLabel = e.kind === 'clerk' ? (e.action === 'create' ? t('confirmAdd') : e.action === 'delete' ? t('confirmDeleteBtn') : t('confirm')) : t('allow')
    const yes = el('button', 'btn primary', yesLabel); yes.onclick = () => go(true)
    row.append(no, yes)
  } else {
    const openBtn = el('button', 'btn primary', t('openWindow')); openBtn.onclick = openBrowser
    row.append(openBtn)
  }
  c.append(row)
  const list = cards.get(e.id) ?? []
  list.push({ c, row }); cards.set(e.id, list)
  return c
}
function closeCard(id, label, ok = true) {
  open.delete(id)
  for (const { c, row } of cards.get(id) ?? []) {
    row.className = 'done' + (ok ? '' : ' no')
    row.innerHTML = ''
    row.insertAdjacentHTML('afterbegin', icon(ok ? 'tick' : 'cross'))
    row.append(el('span', '', label))

}
// Approvals wait in their own chat. When Bob needs you in a different chat from the one you are looking at, say so.
function refreshBanner() {
  const elsewhere = [...open.values()].find(x => x.e.cid && x.e.cid !== activeCid)
  const b = $('banner')
  b.hidden = !elsewhere || currentView === 'settings'
  if (b.hidden) return
  b.textContent = ''

  b.append(el('span', '', t('needsYouIn', name)))
  b.onclick = () => selectConv(elsewhere.e.cid)
}

// ---- live events from the server ----
let activeTakeover = null
function track(e) { // approvals and takeovers belong to every conversation, because the browser and server are shared
  if (e.type === 'approval' || e.type === 'takeover') {
    open.set(e.id, { e, kind: e.type })
    if (e.type === 'takeover') { activeTakeover = e.id; $('handBack').hidden = false; openBrowser() }
    refreshBanner()
  } else if (e.type === 'approval_done' || e.type === 'takeover_done') {
    open.delete(e.id)
    if (e.type === 'takeover_done' && activeTakeover === e.id) { activeTakeover = null; $('handBack').hidden = true; closeBrowser() }
    refreshBanner()
  }
}
function render(e) {
  if (e.type === 'message') { stamp(e.at); message(e.role, e.text, e.files ?? []) }
  else if (e.type === 'step') step(e.name)
  else if (e.type === 'error') notice(e.text, true)
  else if (e.type === 'notice') notice(t(e.code === 'BUDGET_NEAR' ? 'budgetNear' : e.code === 'EXTENSIONS_BROKEN' ? 'extensionsBroken' : 'budgetExceeded'), true)
  else if (e.type === 'card') add(e.card.kind === 'job' ? jobCard(e.card.job, e.card.timezone, true, e.card.created) : e.card.kind === 'todo' ? todoCard(e.card.todo, e.card.timezone, e.card.created) : infoCard(e.card), 'card')
  else if (e.type === 'approval' || e.type === 'takeover') {
    add(buildCard(e, e.type), 'card')

function startRename(c, li) {

// Swipe a row left to reveal the red cross. Works with touch and mouse; the delete button is also reachable with the keyboard.
function swipe(li, main, onTap) {
  let startX = 0, startY = 0, base = 0, id = null, dragging = false, moved = false
  main.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return
    id = e.pointerId; startX = e.clientX; startY = e.clientY; dragging = false; moved = false
    base = li.classList.contains('open') ? -REVEAL : 0
  })
  main.addEventListener('pointermove', e => {
    if (id !== e.pointerId) return
    const dx = e.clientX - startX, dy = e.clientY - startY
    if (!dragging) {
      if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy) * 1.2) { dragging = true; main.setPointerCapture(e.pointerId); closeRows(li); main.style.transition = 'none' }
      else return
    }
    moved = true
    main.style.transform = `translateX(${Math.max(-REVEAL, Math.min(0, base + dx))}px)`
  })
  const finish = e => {
    if (id !== e.pointerId) return
    id = null
    if (!dragging) return
    const x = new DOMMatrix(getComputedStyle(main).transform).m41
    main.style.transition = ''; main.style.transform = ''
    li.classList.toggle('open', x < -REVEAL / 2)
  }
  main.addEventListener('pointerup', finish)
  main.addEventListener('pointercancel', finish)
  main.addEventListener('click', () => {
    if (moved) { moved = false; return }
    if (li.querySelector('.conv-rename')) return
    if (li.classList.contains('open')) { li.classList.remove('open'); return }
    onTap()
  })
}

let source
function connect() {
  source?.close()
  source = new EventSource('/api/events')
  source.onerror = () => { $('offline').hidden = false } // the browser reconnects by itself
  source.onmessage = async m => {
    const e = JSON.parse(m.data)
    if (e.type === 'hello') {
      $('offline').hidden = true
      open.clear()
      for (const p of e.pending) open.set(p.id, { e: p, kind: p.type })
      activeTakeover = [...open.values()].find(x => x.kind === 'takeover')?.e.id ?? null
      $('handBack').hidden = !activeTakeover
      showBudget(e.budget); runningCid = e.running; setBadge(e.unread)
      await loadConvs()
      if (activeCid === undefined && !restoredOnce) { restoredOnce = true; await restoreLastPage() }
      else if (activeCid) await loadHistory(activeCid) // catch up after a dropped connection
      refreshBanner()
    }
    else if (e.type === 'conversations') refreshConvs()
    else if (e.type === 'clerk') loadClerk()
    else if (e.type === 'extensions') { if (currentView === 'settings') loadExtensions() }
    else if (e.type === 'features') loadFeatures()
    else if (e.type === 'trial_done') toast(t(e.kept ? 'trialKept' : e.reason === 'timeout' ? 'trialTimeout' : e.reason === 'crashed' ? 'trialCrashed' : 'trialUndone', e.title), !e.kept && e.reason !== 'rejected')
    else if (e.type === 'memory') { if (currentView === 'settings') loadMemory() }
    else if (e.type === 'budget') showBudget(e)
    else if (e.type === 'status') {
      if (e.status === 'running') { if (runningCid !== e.cid) workSteps = 0; runningCid = e.cid }
      else if (runningCid === e.cid) {
        runningCid = null
        if (e.cid === activeCid && workSteps >= 2 && !clerkData?.jobs.some(j => j.cid === e.cid)) offerRoutine()
        workSteps = 0
      }
      refreshOrb()
      if (!$('drawer').inert) drawConvs()
    }
    else route(e)
  }
}

// ---- attachments (text files) ----
const MAX_FILES = 5, MAX_FILE_CHARS = 200000, MAX_TOTAL_CHARS = 500000
const TEXT_NAME = /\.(txt|md|markdown|csv|tsv|json|jsonl|log|xml|html?|ya?ml|ini|sql)$/i
let attachments = []
const kb = n => (n < 1024 ? n + ' B' : Math.round(n / 1024) + ' KB')
function drawAttachments() {
  $('composer').classList.toggle('empty', !$('text').value.trim() && !attachments.length)
  const row = $('attachRow')
  row.textContent = ''
  row.hidden = attachments.length === 0 || $('composer').hidden
  attachments.forEach((f, i) => {
    const chip = el('span', 'file-chip')
    chip.insertAdjacentHTML('afterbegin', icon('file'))
    const x = el('button'); x.type = 'button'; x.title = t('remove'); x.setAttribute('aria-label', t('remove')); x.innerHTML = icon('cross')
    x.onclick = () => { attachments.splice(i, 1); drawAttachments() }
    chip.append(el('span', 'n', f.name), el('small', '', kb(f.text.length)), x)
    row.append(chip)
  })
}
async function readText(file) {
  const buf = await file.arrayBuffer()
  let text
  try { text = new TextDecoder('utf-8', { fatal: true }).decode(buf) }
  catch { try { text = new TextDecoder('gbk').decode(buf) } catch { return null } } // Excel in China often saves CSV as GBK
  return /\u0000/.test(text) ? null : text.replace(/^﻿/, '')
}
$('attachBtn').onclick = () => $('filePick').click()

// ---- voice input: the browser's own dictation, no audio leaves the device for Safari ----
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition
let speech = null
let speechOn = false
let speechBase = ''
if (!SpeechRecognition) $('micBtn').hidden = true
else {
  speech = new SpeechRecognition()
  speech.lang = zh ? 'zh-CN' : 'en-US'
  speech.interimResults = true
  speech.continuous = false
  speech.onresult = event => {
    let said = ''
    for (let i = 0; i < event.results.length; i++) said += event.results[i][0].transcript
    setText((speechBase + said).slice(0, 4000))
  }
  speech.onend = () => { speechOn = false; $('micBtn').classList.remove('rec') }
  speech.onerror = event => {
    speechOn = false
    $('micBtn').classList.remove('rec')
    if (event.error === 'not-allowed' || event.error === 'service-not-allowed') notice(t('micDenied'), true)
  }
  $('micBtn').onclick = () => {
    if (speechOn) { speech.stop(); return }
    speechBase = $('text').value ? $('text').value.replace(/\s+$/, '') + ' ' : ''
    try { speech.start(); speechOn = true; $('micBtn').classList.add('rec') } catch { speechOn = false; $('micBtn').classList.remove('rec') }
  }
}
$('filePick').onchange = async () => {
  const picked = [...$('filePick').files]
  $('filePick').value = ''
  for (const file of picked) {
    if (attachments.length >= MAX_FILES) { notice(t('filesMany'), true); break }
    if (!TEXT_NAME.test(file.name) && !file.type.startsWith('text/')) { notice(t('fileUnsupported', file.name), true); continue }
    if (file.size > MAX_FILE_CHARS * 4) { notice(t('fileBig', file.name), true); continue }
    const text = await readText(file)
    if (text === null) { notice(t('fileBinary', file.name), true); continue }
    if (text.length > MAX_FILE_CHARS) { notice(t('fileBig', file.name), true); continue }
    if (attachments.reduce((n, f) => n + f.text.length, 0) + text.length > MAX_TOTAL_CHARS) { notice(t('filesTotal'), true); continue }
    attachments.push({ name: file.name, text })
  }
  drawAttachments()
}
/** The message box grows with what is typed, up to a few lines. */
function fitText() {
  const box = $('text')
  box.style.height = 'auto'

$('text').addEventListener('input', fitText)
$('text').addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.shiftKey || e.isComposing) return // Shift+Enter is a new line; Enter while choosing Chinese characters is not a send

$('composer').onsubmit = async e => {
  e.preventDefault()
  const text = $('text').value.trim()
  if (!text && !attachments.length) return
  const files = attachments
  setText('')
  attachments = []; drawAttachments()
  const restore = () => { setText(text); attachments = files; drawAttachments() } // keep the draft so nothing is lost
  if (!activeCid) {
    const made = await post('/api/conversations')
    if (made.status !== 200) { restore(); notice(errText(made.data, made.status), true); return }
    activeCid = made.data.id
  }
  const { status, data } = await post('/api/chat', { cid: activeCid, text, files })
  if (status === 200) { refreshConvs(); return }
  restore()
  if (data.error === 'NO_KEY') { $('settingsMsg').textContent = t('noKey'); show('settings') }
  else if (data.error === 'BUDGET_EXCEEDED') notice(t('budgetExceeded'), true)
  else if (data.error === 'BUSY_OTHER') notice(t('busyOther'), true)
  else notice(errText(data, status), true)
}

// ---- the browser window: it takes the shape of the device that opens it ----
// A phone gets a phone-sized page, a mobile site and touch. A PC gets a desktop page, a mouse and the keyboard.
// "Desktop site" lays the page out wide for sites with no mobile version, and two fingers zoom and move it.
const canvas = $('screen'), ctx = canvas.getContext('2d')
let ws, spec = null, desktopSite = false, remoteZoomed = false // remoteZoomed: the cloud page itself is zoomed in on a field
const zoom = { z: 1, x: 0, y: 0 }
const isPhone = () => matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) < 700
const sendWs = m => { if (ws?.readyState === 1) ws.send(JSON.stringify(m)) }
function measure() {
  const r = $('stage').getBoundingClientRect()
  const w = Math.max(Math.floor(r.width), 200), h = Math.max(Math.floor(r.height), 200)
  const phone = isPhone()
  const lang = (navigator.languages?.length ? navigator.languages : [navigator.language]).slice(0, 4).map((l, i) => (i ? `${l};q=${(1 - i * 0.1).toFixed(1)}` : l)).join(',')
  if (phone && desktopSite) return { device: 'desktop', w: 1280, h: Math.round(1280 * h / w), dpr: 2, lang, cw: w, ch: h }
  return { device: phone ? 'phone' : 'desktop', w, h, dpr: Math.min(window.devicePixelRatio || 1, 2), lang, cw: w, ch: h }
}
function setZoom(z, x, y) {
  const w = canvas.clientWidth, h = canvas.clientHeight
  zoom.z = Math.min(Math.max(z, 1), 4)
  zoom.x = Math.min(0, Math.max(x, w - w * zoom.z))
  zoom.y = Math.min(0, Math.max(y, h - h * zoom.z))
  canvas.style.transform = zoom.z === 1 ? '' : `translate(${zoom.x}px, ${zoom.y}px) scale(${zoom.z})`
  $('fitBtn').hidden = !remoteZoomed && zoom.z <= 1.01
}
function sendViewport() {
  spec = measure()
  canvas.style.width = spec.cw + 'px'; canvas.style.height = spec.ch + 'px'
  setZoom(1, 0, 0)
  sendWs({ t: 'viewport', device: spec.device, w: spec.w, h: spec.h, dpr: spec.dpr, lang: spec.lang })
}
let wantWindow = false // true while the owner has the window open, so a dropped connection comes back by itself
let remoteField = null // the field on the page that has the keyboard
function openBrowser() {
  $('browser').hidden = false
  const hint = $('takeoverHint')
  const why = open.get(activeTakeover)?.e.reason
  hint.hidden = !activeTakeover
  hint.textContent = activeTakeover ? (why ? t('takeoverWhy', why) : t('takeoverHint')) : ''
  $('modeBtn').hidden = !isPhone()
  wantWindow = true
  showField(null)
  connectWindow()
}
function connectWindow() {
  ws = new WebSocket(location.origin.replace(/^http/, 'ws') + '/ws/browser')
  ws.binaryType = 'blob'
  ws.onopen = () => { $('stageNote').hidden = true; sendViewport() }
  ws.onmessage = async m => {
    if (typeof m.data === 'string') { const e = JSON.parse(m.data); if (e.t === 'state') pageState(e); else if (e.error) toast(e.error, true); return }
    const bmp = await createImageBitmap(m.data)
    if (canvas.width !== bmp.width || canvas.height !== bmp.height) { canvas.width = bmp.width; canvas.height = bmp.height }
    ctx.drawImage(bmp, 0, 0); bmp.close()
  }
  ws.onclose = e => {
    if (!wantWindow) return
    $('stageNote').hidden = false
    if (e.code === 4001) { $('stageNote').textContent = t('openedElsewhere'); return }
    $('stageNote').textContent = t('reconnecting')
    setTimeout(() => { if (wantWindow) connectWindow() }, 1200)
  }
}
function closeBrowser() { wantWindow = false; ws?.close(); ws = null; $('browser').hidden = true; $('stageNote').hidden = true; setZoom(1, 0, 0) }

// Typing: the box below the page is a real text box, so the phone keyboard, Chinese input, paste and SMS codes all work.
// While a field on the page has the keyboard, whatever the box says is what that field says.
function showField(field) {
  const changed = (field?.key ?? '') !== (remoteField?.key ?? '')
  remoteField = field
  $('fillRow').classList.toggle('live', Boolean(field))
  $('fillBtn').hidden = Boolean(field)

// pointer input. The position is a fraction of the page picture, so zooming needs no special handling.
const norm = e => {
  const r = canvas.getBoundingClientRect()
  return { x: Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), y: Math.min(1, Math.max(0, (e.clientY - r.top) / r.height)) }
}
const sendPt = (k, e) => sendWs({ t: 'pointer', k, ...norm(e) })
let moveQueued = null
function queueMove(kind, e) {
  const first = moveQueued === null
  moveQueued = { kind, p: norm(e) }
  if (first) requestAnimationFrame(() => { const m = moveQueued; moveQueued = null; sendWs({ t: 'pointer', k: m.kind, ...m.p }) })
}
const touches = new Map()
let g = null, pinch = null, pinchLock = false
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y)
const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 })
function startPinch() {
  if (g?.timer) clearTimeout(g.timer)
  if (g?.down) sendPt('up', g.last) // the first finger had already touched the page: let go of it
  g = null
  const [a, b] = [...touches.values()]
  const r = $('stage').getBoundingClientRect()
  pinch = { d0: dist(a, b), z0: zoom.z, x0: zoom.x, y0: zoom.y, c0: { x: mid(a, b).x - r.left, y: mid(a, b).y - r.top } }
}
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId)
  canvas.focus({ preventScroll: true })
  if (e.pointerType === 'mouse') { sendPt('down', e); return }
  touches.set(e.pointerId, { x: e.clientX, y: e.clientY })
  if (pinchLock) return
  if (touches.size === 2) { startPinch(); return }
  g = { id: e.pointerId, sx: e.clientX, sy: e.clientY, last: e, down: false, scrolling: false }
  // On a phone, wait a moment before touching the page, in case this is the first finger of a pinch.
  if (spec?.device === 'phone') g.timer = setTimeout(() => { if (g && !pinch) { g.down = true; sendPt('down', { clientX: g.sx, clientY: g.sy }) } }, 70)
})
canvas.addEventListener('pointermove', e => {
  if (e.pointerType === 'mouse') { queueMove(e.buttons ? 'move' : 'hover', e); return }
  if (touches.has(e.pointerId)) touches.set(e.pointerId, { x: e.clientX, y: e.clientY })
  if (pinch && touches.size >= 2) {
    const [a, b] = [...touches.values()]
    const r = $('stage').getBoundingClientRect()
    const c = { x: mid(a, b).x - r.left, y: mid(a, b).y - r.top }
    const z = Math.min(Math.max(pinch.z0 * dist(a, b) / pinch.d0, 1), 4)
    const px = (pinch.c0.x - pinch.x0) / pinch.z0, py = (pinch.c0.y - pinch.y0) / pinch.z0 // the page point that was under the fingers
    setZoom(z, c.x - px * z, c.y - py * z)
    return
  }
  if (!g || g.id !== e.pointerId || pinchLock) return
  g.last = e
  const moved = Math.hypot(e.clientX - g.sx, e.clientY - g.sy)
  if (spec?.device === 'phone') {
    if (!g.down && moved > 6) { clearTimeout(g.timer); g.down = true; sendPt('down', { clientX: g.sx, clientY: g.sy }) }
    if (g.down) queueMove('move', e)
  } else { // a desktop page on a phone: a drag scrolls it, a tap clicks
    if (!g.scrolling && moved > 8) { g.scrolling = true; g.px = e.clientX; g.py = e.clientY }
    if (g.scrolling) {
      const toPage = (spec?.w ?? canvas.clientWidth) / canvas.getBoundingClientRect().width
      sendWs({ t: 'wheel', d: -(e.clientY - g.py) * toPage, dx: -(e.clientX - g.px) * toPage })
      g.px = e.clientX; g.py = e.clientY
    }
  }
})
function endTouch(e) {

  touches.delete(e.pointerId)

  if (touches.size === 0) pinchLock = false
  if (!g || g.id !== e.pointerId) return
  clearTimeout(g.timer)
  if (spec?.device === 'phone') {
    if (!g.down) sendPt('down', { clientX: g.sx, clientY: g.sy }) // a quick tap
    sendPt('up', e)
  } else if (!g.scrolling) { sendPt('down', { clientX: g.sx, clientY: g.sy }); sendPt('up', { clientX: g.sx, clientY: g.sy }) }
  g = null
}
canvas.addEventListener('pointerup', endTouch)
canvas.addEventListener('pointercancel', endTouch)
canvas.addEventListener('wheel', e => { e.preventDefault(); sendWs({ t: 'wheel', d: e.deltaY, dx: e.deltaX }) }, { passive: false })
const KEYS = ['Enter', 'Backspace', 'Tab', 'Escape', 'Delete', 'ArrowLeft', 'ArrowUp', 'ArrowRight', 'ArrowDown', 'Home', 'End', 'PageUp', 'PageDown']

  if (isPhone() || e.isComposing || e.ctrlKey || e.metaKey || e.altKey) return
  if (KEYS.includes(e.key)) { e.preventDefault(); sendWs({ t: 'key', k: e.key }) }
  else if (e.key.length === 1) { e.preventDefault(); sendWs({ t: 'text', v: e.key }) }

$('navForm').onsubmit = e => { e.preventDefault(); if ($('url').value.trim()) sendWs({ t: 'nav', url: $('url').value.trim() }) }
$('fillBtn').onclick = () => { if ($('fill').value) { sendWs({ t: 'text', v: $('fill').value }); $('fill').value = '' } }
$('enterBtn').onclick = () => sendWs({ t: 'key', k: 'Enter' })
$('backBtn').onclick = () => sendWs({ t: 'key', k: 'Backspace' })
$('togglePw').onclick = () => {
  const f = $('fill'), hide = f.type !== 'password'
  f.type = hide ? 'password' : 'text'
  $('togglePw').innerHTML = icon(hide ? 'eyeoff' : 'eye')
}

async function boot() {
  const s = await (await fetch('/api/state')).json()
  $('login').hidden = s.authed
  $('app').hidden = !s.authed
  if (!s.authed) { if (!s.pinSet) $('loginMsg').textContent = t('noPin'); return }
  appState = s
  showBuild(s)
  setBadge(s.unread)
  show('chat')
  if (!s.hasKey) { $('settingsMsg').textContent = t('noKey'); show('settings') }
  connect()
  reportPresence(true)
  loadClerk() // the front page shows what is waiting
  loadFeatures() // widgets and styling the owner has kept
}
boot()
</script>
</body>
</html>
