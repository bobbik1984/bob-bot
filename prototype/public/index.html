<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f4f6fb">
<title>Bob</title>
<style>
:root {
  color-scheme: light;
  --bg:#f4f6fb; --surface:#ffffff; --surface-2:#eef1f7; --text:#1b2230; --muted:#6c778a; --line:#e3e8f1;
  --accent:#2f6bff; --accent-text:#ffffff; --accent-soft:#e4edff; --accent-ink:#2457d6; --bubble-user:#dbe8ff;
  --danger:#d64545; --danger-soft:#fdeceb; --ok:#1f9d6b; --ok-soft:#e3f6ee; --warn:#b7791f; --warn-soft:#fff3dc;
  --shadow:0 6px 24px rgba(30,50,110,.08); --shade:rgba(15,23,42,.45); --stage:#0b0f1a;
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; margin:0; }
body { background:var(--bg); color:var(--text); font:16px/1.55 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
button, input, select { font:inherit; color:inherit; }
button { cursor:pointer; border:0; background:none; padding:0; }
button:focus-visible, input:focus-visible, select:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
svg { width:1.25em; height:1.25em; flex:none; }
[hidden] { display:none !important; }

.btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px; padding:0 18px; border-radius:14px; background:var(--surface-2); font-weight:600; }
.btn.primary { background:var(--accent); color:var(--accent-text); }
.btn.danger { background:var(--danger-soft); color:var(--danger); }
.btn.block { width:100%; }
.icon-btn { width:40px; height:40px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; color:var(--muted); }
.icon-btn:active, .btn:active { transform:scale(.97); }
.field { width:100%; min-width:0; min-height:44px; padding:0 14px; border-radius:14px; border:1px solid var(--line); background:var(--surface); }

/* the Bob orb: napping, thinking, speaking */
.orb { --s:28px; position:relative; width:var(--s); height:var(--s); flex:none; display:inline-block; }
.orb.big { --s:84px; }
.orb i { position:absolute; inset:0; border-radius:50%; pointer-events:none; }
.orb .core { background:radial-gradient(circle at 34% 28%, #a9c1ff, var(--accent) 60%, #2349b8); box-shadow:0 2px 10px rgba(47,107,255,.35); }
.orb .ring { inset:-4px; opacity:0; background:conic-gradient(from 0deg, transparent 0 50%, var(--accent) 100%);
  -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2.5px)); mask:radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2.5px)); }
.orb .wave { border:2px solid var(--accent); opacity:0; }
.orb[data-state=nap] .core { animation:nap 5s ease-in-out infinite; filter:saturate(.5) brightness(1.1); }
.orb[data-state=think] .core { animation:think 1.4s ease-in-out infinite; }
.orb[data-state=think] .ring { opacity:1; animation:spin 1.1s linear infinite; }
.orb[data-state=speak] .core { animation:talk .9s ease-in-out infinite; }
.orb[data-state=speak] .wave { animation:ripple 1.5s ease-out infinite; }
.orb[data-state=speak] .wave.w2 { animation-delay:.55s; }
.orb.static .core { animation:none !important; filter:none; box-shadow:none; }
@keyframes nap { 0%,100% { transform:scale(.88); opacity:.75; } 50% { transform:scale(1); opacity:1; } }
@keyframes think { 0%,100% { transform:scale(.92); } 50% { transform:scale(1.04); } }
@keyframes talk { 0%,100% { transform:scale(1); } 25% { transform:scale(1.08); } 50% { transform:scale(.95); } 75% { transform:scale(1.05); } }
@keyframes ripple { 0% { transform:scale(1); opacity:.55; } 100% { transform:scale(1.9); opacity:0; } }
@keyframes spin { to { transform:rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  .orb i { animation:none !important; }
  .orb[data-state=think] .ring { opacity:.9; }
  .orb[data-state=speak] .wave { opacity:.4; transform:scale(1.35); }
  .typing i { animation:none !important; opacity:.7 !important; }
}

/* login */
#login { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:16px; }
#login h1 { margin:6px 0 0; font-size:28px; letter-spacing:.2px; }
#login .sub { margin:0; color:var(--muted); font-size:14px; }
.dots { display:flex; gap:16px; margin-top:10px; }
.dots i { width:14px; height:14px; border-radius:50%; border:2px solid var(--line); background:var(--surface); transition:background .12s, border-color .12s; }
.dots i.on { background:var(--accent); border-color:var(--accent); }
#loginMsg { min-height:24px; color:var(--danger); font-size:14px; text-align:center; max-width:300px; }
.pad { display:grid; grid-template-columns:repeat(3,72px); gap:14px 18px; }
.pad button { height:72px; border-radius:50%; font-size:26px; background:var(--surface); box-shadow:var(--shadow); border:1px solid var(--line); }
.pad button:active { background:var(--accent-soft); }
.pad .ghost { background:transparent; box-shadow:none; border-color:transparent; font-size:15px; color:var(--muted); }

/* app shell */
#app { height:100%; height:100dvh; display:flex; flex-direction:column; max-width:720px; margin:0 auto; background:var(--bg); position:relative; overflow:hidden; }
header { display:grid; grid-template-columns:48px 1fr 48px; align-items:center; padding:calc(8px + env(safe-area-inset-top)) 8px 8px; }
header .title { display:flex; align-items:center; justify-content:center; gap:10px; min-width:0; }
header .ttext { line-height:1.2; min-width:0; }
header .ttext b { display:block; font-size:18px; }
header .ttext small { display:block; font-size:12px; color:var(--muted); min-height:16px; }
header .right { justify-self:end; }
main { flex:1; min-height:0; position:relative; }
.view { position:absolute; inset:0; overflow-y:auto; scrollbar-gutter:stable; padding:6px 14px 14px; }

/* chat */
#welcome { display:flex; flex-direction:column; align-items:center; gap:4px; padding:28px 0 8px; text-align:center; }
#welcome b { font-size:20px; margin-top:14px; }
#welcome span.s { color:var(--muted); font-size:14px; }
.chips { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:14px; }
.chip-btn { padding:9px 14px; border-radius:999px; background:var(--surface); border:1px solid var(--line); font-size:14px; box-shadow:var(--shadow); }
#feed { display:flex; flex-direction:column; gap:10px; }
.bubble-row { display:flex; gap:8px; align-items:flex-end; }
.bubble-row.user { justify-content:flex-end; }
.bubble-row .spacer { width:28px; flex:none; }
.msg { max-width:84%; padding:10px 14px; border-radius:20px; white-space:pre-wrap; overflow-wrap:anywhere; background:var(--surface); border:1px solid var(--line); border-bottom-left-radius:6px; }
.bubble-row.user .msg { background:var(--bubble-user); border-color:transparent; border-bottom-left-radius:20px; border-bottom-right-radius:6px; }
.typing { display:flex; gap:5px; padding:14px 16px; }
.typing i { width:7px; height:7px; border-radius:50%; background:var(--muted); opacity:.45; animation:blink 1.2s infinite; }
.typing i:nth-child(2) { animation-delay:.2s; } .typing i:nth-child(3) { animation-delay:.4s; }
@keyframes blink { 40% { opacity:1; transform:translateY(-2px); } }
.steps { margin-left:36px; font-size:13px; color:var(--muted); background:var(--surface-2); border-radius:14px; padding:2px 12px; max-width:84%; }
.steps summary { cursor:pointer; padding:8px 0; list-style:none; display:flex; align-items:center; gap:8px; }
.steps summary::-webkit-details-marker { display:none; }
.steps summary svg { width:1em; height:1em; }
.steps ul { margin:0 0 8px; padding:0 0 0 22px; }
.notice { font-size:13px; color:var(--muted); text-align:center; padding:2px 8px; }
.notice.err { color:var(--danger); background:var(--danger-soft); border-radius:12px; padding:8px 12px; }
.fileline { display:flex; align-items:center; gap:6px; margin-top:6px; font-size:13px; color:var(--muted); }
.fileline svg { width:1em; height:1em; }

/* cards */
.card { background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:14px; display:flex; flex-direction:column; gap:10px; box-shadow:var(--shadow); }
.card-top { display:flex; align-items:center; gap:8px; }
.card-top .chipicon { width:32px; height:32px; border-radius:10px; display:inline-flex; align-items:center; justify-content:center; background:var(--accent-soft); color:var(--accent-ink); }
.card.help .chipicon { background:var(--warn-soft); color:var(--warn); }
.tag { font-size:12px; font-weight:600; color:var(--accent-ink); background:var(--accent-soft); padding:2px 8px; border-radius:6px; }
.card.help .tag { color:var(--warn); background:var(--warn-soft); }
.card .time { margin-left:auto; font-size:12px; color:var(--muted); }
.card .lead { color:var(--muted); font-size:13px; }
.card .what { font-weight:700; overflow-wrap:anywhere; }
.card .where { font-size:12px; color:var(--muted); overflow-wrap:anywhere; margin-top:-6px; }
.card pre.detail { margin:0; padding:10px 12px; border-radius:12px; background:var(--surface-2); font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; white-space:pre-wrap; overflow-wrap:anywhere; max-height:180px; overflow:auto; }
.card img { width:100%; max-height:240px; object-fit:contain; border-radius:12px; background:var(--stage); }
.card .actions { display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:10px; }
.card .done { display:flex; align-items:center; gap:6px; color:var(--ok); font-weight:600; font-size:14px; }
.card .done.no { color:var(--muted); }
#pendingEmpty { display:flex; flex-direction:column; align-items:center; gap:8px; padding:60px 20px; color:var(--muted); text-align:center; }
#pendingEmpty svg { width:44px; height:44px; color:var(--ok); }
#pendingList { display:flex; flex-direction:column; gap:12px; }

/* settings */
.section { background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:16px; margin-bottom:12px; display:flex; flex-direction:column; gap:10px; box-shadow:var(--shadow); }
.section h3 { margin:0; font-size:15px; }
.hint { margin:0; font-size:13px; color:var(--muted); }
.row { display:flex; gap:8px; align-items:center; }
.row > .field { flex:1; }
.bar { height:8px; border-radius:99px; background:var(--surface-2); overflow:hidden; }
.bar i { display:block; height:100%; width:0; background:var(--accent); border-radius:99px; transition:width .3s; }
.bar.warn i { background:var(--warn); } .bar.over i { background:var(--danger); }
.big-n { font-size:26px; font-weight:700; }
.big-n small { font-size:14px; font-weight:400; color:var(--muted); }
#settingsMsg { min-height:20px; }
select.field { appearance:none; background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%); background-position:calc(100% - 20px) 50%, calc(100% - 14px) 50%; background-size:6px 6px; background-repeat:no-repeat; padding-right:36px; }
.stack { display:flex; flex-direction:column; gap:10px; }
.keystate { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:14px; background:var(--ok-soft); color:var(--ok); font-weight:600; font-size:14px; }
.keystate.none { background:var(--warn-soft); color:var(--warn); }
.keystate code { font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; color:var(--text); font-weight:400; opacity:.8; }
.keystate .link { margin-left:auto; color:var(--accent-ink); font-weight:600; padding:6px 4px; }

/* composer and tabs */
#composer { display:flex; align-items:center; gap:4px; margin:4px 12px 8px; padding:5px 5px 5px 6px; background:var(--surface); border:1px solid var(--line); border-radius:28px; box-shadow:var(--shadow); }
#composer input { flex:1; min-width:0; border:0; background:none; min-height:40px; }
#composer input:focus-visible { outline:0; }
#composer:focus-within { border-color:var(--accent); }
#composer .send { width:42px; height:42px; border-radius:50%; background:var(--accent); color:var(--accent-text); display:inline-flex; align-items:center; justify-content:center; }
#composer .attach { width:40px; height:40px; border-radius:50%; color:var(--muted); display:inline-flex; align-items:center; justify-content:center; flex:none; }
#attachRow { display:flex; flex-wrap:wrap; gap:6px; margin:6px 12px 0; }
.file-chip { display:inline-flex; align-items:center; gap:6px; max-width:100%; padding:5px 6px 5px 10px; border-radius:999px; background:var(--accent-soft); color:var(--accent-ink); font-size:13px; }
.file-chip span.n { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:180px; }
.file-chip small { opacity:.7; }
.file-chip button { width:22px; height:22px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; color:inherit; }
.file-chip svg { width:1em; height:1em; }
nav { display:flex; border-top:1px solid var(--line); background:var(--surface); padding-bottom:env(safe-area-inset-bottom); }
nav button { flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:8px 0 7px; font-size:12px; color:var(--muted); position:relative; }
nav button.on { color:var(--accent); font-weight:600; }
nav button svg { width:24px; height:24px; }
.badge { position:absolute; top:3px; left:calc(50% + 6px); min-width:18px; height:18px; padding:0 5px; border-radius:9px; background:var(--danger); color:#fff; font-size:11px; line-height:18px; text-align:center; }

/* history drawer */
#scrim { position:absolute; inset:0; background:var(--shade); opacity:0; pointer-events:none; transition:opacity .2s; z-index:3; }
#scrim.on { opacity:1; pointer-events:auto; }
#drawer { position:absolute; top:0; bottom:0; left:0; width:min(86%, 330px); background:var(--surface); z-index:4; transform:translateX(-102%); transition:transform .22s ease; display:flex; flex-direction:column; padding:calc(12px + env(safe-area-inset-top)) 0 calc(8px + env(safe-area-inset-bottom)); box-shadow:var(--shadow); }
#drawer.open { transform:none; }
.dhead { display:flex; align-items:center; gap:10px; padding:0 12px 12px 18px; }
.dhead b { font-size:18px; margin-right:auto; }
#newChat { margin:0 14px 12px; }
.dtitle { padding:4px 18px 6px; font-size:12px; font-weight:600; color:var(--muted); letter-spacing:.3px; }
#convList { list-style:none; margin:0; padding:0; flex:1; overflow-y:auto; scrollbar-gutter:stable; }
.conv { position:relative; overflow:hidden; height:62px; transition:height .18s, opacity .18s; }
.conv.gone { height:0; opacity:0; }
.conv-main { position:relative; z-index:1; width:100%; height:100%; display:flex; flex-direction:column; justify-content:center; align-items:flex-start; gap:2px; padding:0 18px; background:var(--surface); text-align:left; touch-action:pan-y; user-select:none; transition:transform .2s ease; }
.conv.active .conv-main { background:var(--accent-soft); }
.conv.open .conv-main { transform:translateX(-76px); }
.conv-del { position:absolute; top:0; right:0; bottom:0; width:76px; background:var(--danger); color:#fff; display:flex; align-items:center; justify-content:center; }
.conv-del svg { width:24px; height:24px; }
.conv-del:focus-visible ~ .conv-main { transform:translateX(-76px); }
.conv-main .ct { max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; }
.conv-main .cs { color:var(--muted); font-size:12px; }
.conv.empty-row { height:auto; padding:18px; color:var(--muted); font-size:14px; }
#convMsg { padding:6px 18px; min-height:20px; color:var(--danger); }
#drawerSpend { margin:4px 14px 0; padding:10px 12px; border-radius:14px; background:var(--surface-2); color:var(--muted); font-size:13px; text-align:left; }

/* browser window */
#browser { position:fixed; inset:0; background:var(--bg); display:flex; flex-direction:column; z-index:5; }
#browser .top { display:flex; gap:8px; align-items:center; padding:calc(8px + env(safe-area-inset-top)) 10px 8px; }
#browser .top form { flex:1; display:flex; gap:8px; min-width:0; }
#stage { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; overflow:hidden; background:var(--stage); }
#screen { touch-action:none; display:block; background:#fff; }
#browser .tools { padding:8px 10px calc(8px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:8px; }
#browser .tools .icon-btn { background:var(--surface); border:1px solid var(--line); border-radius:12px; width:44px; height:44px; color:var(--text); }
#browser .tools .row.keys { justify-content:space-between; }
</style>
</head>
<body>
<section id="login" hidden>
  <span class="orb big" data-orb data-state="nap"></span>
  <h1>Bob</h1>
  <p class="sub" data-t="loginSub"></p>
  <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
  <div id="loginMsg" role="status"></div>
  <div class="pad" id="pad"></div>
</section>

<section id="app" hidden>
  <header>
    <button class="icon-btn" id="menuBtn" data-al="menu" data-i="menu"></button>
    <div class="title">
      <span class="orb" id="hOrb" data-orb data-state="nap"></span>
      <div class="ttext"><b id="title">Bob</b><small id="sub"></small></div>
    </div>
    <button class="icon-btn right" id="openBrowser" data-al="browser" data-i="globe"></button>
  </header>
  <main>
    <div class="view" id="viewChat">
      <div id="welcome">
        <span class="orb big" data-orb data-state="nap"></span>
        <b>Bob</b><span class="s" data-t="welcomeSub"></span>
        <div class="chips" id="chips"></div>
      </div>
      <div id="feed" aria-live="polite"></div>
    </div>
    <div class="view" id="viewPending" hidden>
      <div id="pendingList"></div>
      <div id="pendingEmpty"><span data-i="check"></span><b data-t="pendingEmpty"></b><span class="hint" data-t="pendingHint"></span></div>
    </div>
    <div class="view" id="viewSettings" hidden>
      <div class="section">
        <h3 data-t="modelTitle"></h3>
        <label class="hint" for="modelSel" data-t="modelLabel"></label>
        <select class="field" id="modelSel"></select>
        <div class="keystate" id="keyState"></div>
        <input class="field" id="key" type="password" autocomplete="off" placeholder="sk-..." aria-label="API key" hidden>
        <div class="stack" id="customBox" hidden>
          <p class="hint" data-t="customHint"></p>
          <input class="field" id="cEndpoint" inputmode="url" autocapitalize="off" autocomplete="off" placeholder="https://api.example.com/anthropic" data-al="cEndpoint">
          <input class="field" id="cModel" autocapitalize="off" autocomplete="off" data-ph="cModel" data-al="cModel">
          <input class="field" id="cKey" type="password" autocomplete="off" data-ph="cKey" data-al="cKey">
          <p class="hint" data-t="priceWhy"></p>
          <div class="row"><input class="field" id="cIn" type="number" inputmode="decimal" min="0" step="any" data-ph="cIn" data-al="cIn"><input class="field" id="cOut" type="number" inputmode="decimal" min="0" step="any" data-ph="cOut" data-al="cOut"></div>
        </div>
        <button class="btn primary block" id="saveModel" data-t="save"></button>
      </div>
      <div class="section">
        <h3 data-t="capTitle"></h3>
        <div class="big-n" id="spentBig"></div>
        <div class="bar" id="capBar"><i></i></div>
        <p class="hint" data-t="capLabel"></p>
        <div class="row"><input class="field" id="cap" type="number" inputmode="decimal" min="0.01" step="0.5" aria-label="Monthly limit"><button class="btn" id="saveCap" data-t="save"></button></div>
      </div>
      <p class="hint" id="settingsMsg" role="status"></p>
      <div class="section">
        <h3 data-t="pinTitle"></h3>
        <p class="hint" data-t="pinHint"></p>
        <button class="btn danger block" id="logout" data-t="logout"></button>
      </div>
    </div>
  </main>
  <div id="attachRow" hidden></div>
  <form id="composer">
    <button type="button" class="attach" id="attachBtn" data-al="attach" data-i="clip"></button>
    <input id="text" autocomplete="off" data-ph="placeholder" aria-label="Message">
    <button class="send" data-al="send" data-i="send"></button>
  </form>
  <input type="file" id="filePick" multiple hidden accept=".txt,.md,.markdown,.csv,.tsv,.json,.jsonl,.log,.xml,.html,.htm,.yaml,.yml,.ini,.sql,text/*">
  <nav>
    <button class="on" data-view="chat"><span data-i="chat"></span><span data-t="tabChat"></span></button>
    <button data-view="pending"><span data-i="check"></span><span data-t="tabPending"></span><span class="badge" id="badge" hidden></span></button>
    <button data-view="settings"><span data-i="sliders"></span><span data-t="tabSettings"></span></button>
  </nav>

  <div id="scrim"></div>
  <aside id="drawer" aria-label="History">
    <div class="dhead"><span class="orb" data-orb data-state="nap"></span><b>Bob</b><button class="icon-btn" id="closeDrawer" data-al="close" data-i="cross"></button></div>
    <button class="btn primary" id="newChat" data-i="plus" data-t="newChat"></button>
    <div class="dtitle" data-t="history"></div>
    <ul id="convList"></ul>
    <p class="hint" id="convMsg" role="status"></p>
    <button id="drawerSpend"></button>
  </aside>
</section>

<section id="browser" hidden>
  <div class="top">
    <button class="icon-btn" id="closeBrowser" data-al="close" data-i="back"></button>
    <form id="navForm"><input class="field" id="url" inputmode="url" autocapitalize="off" autocomplete="off" placeholder="https://" aria-label="URL"><button class="btn" data-t="go"></button></form>
  </div>
  <div id="stage"><canvas id="screen"></canvas></div>
  <div class="tools">
    <div class="row"><input class="field" id="fill" autocomplete="off" autocapitalize="off" data-ph="fillPh" aria-label="Text to fill"><button class="icon-btn" id="togglePw" data-al="toggle" data-i="eye"></button><button class="btn primary" id="fillBtn" data-t="fill"></button></div>
    <div class="row keys">
      <button class="icon-btn" id="scrollUp" data-al="up" data-i="up"></button>

const t = (k, n) => (I18N[k]?.[zh ? 0 : 1] ?? k).replace('{n}', n)

const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e }

const icon = name => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>`
const ORB = '<i class="core"></i><i class="ring"></i><i class="wave"></i><i class="wave w2"></i>'

document.querySelectorAll('[data-t]').forEach(e => { e.textContent = t(e.dataset.t) })
document.querySelectorAll('[data-ph]').forEach(e => { e.placeholder = t(e.dataset.ph) })
document.querySelectorAll('[data-al]').forEach(e => { e.setAttribute('aria-label', t(e.dataset.al)); e.title = t(e.dataset.al) })
document.querySelectorAll('[data-i]').forEach(e => e.insertAdjacentHTML('afterbegin', icon(e.dataset.i)))
document.querySelectorAll('[data-orb]').forEach(e => { e.innerHTML = ORB })

const post = async (url, body) => {
  const res = await fetch(url, { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify(body ?? {}) })
  return { status:res.status, data: await res.json().catch(() => ({})) }
}
const errText = (data, status) => I18N['err_' + data.error] ? t('err_' + data.error) : t('failed') + (data.error ?? status)

// ---- PIN ----
let entered = ''
const drawDots = () => [...$('dots').children].forEach((d, i) => d.classList.toggle('on', i < entered.length))
async function submitPin() {
  const { status, data } = await post('/api/login', { pin: entered })
  entered = ''
  drawDots()
  if (status === 200) return boot()
  $('loginMsg').textContent = data.error === 'LOCKED' ? t('locked', Math.ceil(data.retryAfter / 60)) : data.error === 'PIN_NOT_SET' ? t('noPin') : t('wrongPin', data.remaining)
}
const press = d => {
  if (entered.length >= 4) return
  entered += d
  drawDots()
  $('loginMsg').textContent = ''
  if (entered.length === 4) submitPin()
}
;['1','2','3','4','5','6','7','8','9',null,'0','del'].forEach(k => {
  const b = document.createElement('button')
  if (k === null) { b.style.visibility = 'hidden'; b.tabIndex = -1 }
  else if (k === 'del') { b.className = 'ghost'; b.textContent = t('del'); b.onclick = () => { entered = entered.slice(0, -1); drawDots() } }
  else { b.textContent = k; b.onclick = () => press(k) }
  $('pad').append(b)
})
addEventListener('keydown', e => {
  if (!$('login').hidden && /^\d$/.test(e.key)) press(e.key)
  if (e.key === 'Escape') closeDrawer()
})

// ---- views ----
const VIEWS = ['chat', 'pending', 'settings']
function show(view) {
  VIEWS.forEach(v => { $('view' + v[0].toUpperCase() + v.slice(1)).hidden = v !== view })
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.view === view))
  $('composer').hidden = view !== 'chat'
  if (view !== 'chat') $('attachRow').hidden = true
  else drawAttachments()
  $('title').textContent = view === 'chat' ? 'Bob' : t(view === 'pending' ? 'pendingTitle' : 'settingsTitle')
  $('hOrb').hidden = view !== 'chat'
  $('sub').hidden = view !== 'chat'
  if (view === 'chat') atEnd()
  if (view === 'settings') loadModelCard().catch(() => {})
}
document.querySelectorAll('nav button').forEach(b => { b.onclick = () => show(b.dataset.view) })

// ---- the orb: napping, thinking, speaking ----
let runningCid = null, speakUntil = 0, speakTimer = null
function refreshOrb() {
  const mine = Boolean(runningCid) && runningCid === activeCid
  const state = Date.now() < speakUntil ? 'speak' : mine ? 'think' : 'nap'
  $('hOrb').dataset.state = state
  $('sub').textContent = t(state === 'nap' ? 'stateNap' : state === 'think' ? 'stateThink' : 'stateSpeak')
  typing.hidden = !mine
  if (mine) { feed.append(typing); atEnd() }
}
function speak(text) {
  const ms = Math.min(5000, 1200 + text.length * 25)
  speakUntil = Date.now() + ms
  refreshOrb()
  clearTimeout(speakTimer)
  speakTimer = setTimeout(refreshOrb, ms + 50)
}

// ---- feed ----
const feed = $('feed'), scroller = $('viewChat')
const typing = el('div', 'bubble-row')
typing.append(el('div', 'spacer'))
const typingBubble = el('div', 'msg typing'); typingBubble.append(el('i'), el('i'), el('i')); typing.append(typingBubble)
typing.hidden = true
feed.append(typing)
const atEnd = () => { scroller.scrollTop = scroller.scrollHeight }
let lastKind = null, stepsBox = null
const cards = new Map(), open = new Map()
let activeCid // undefined: not chosen yet. null: a new chat that has no messages yet.
const updateWelcome = () => { $('welcome').hidden = feed.children.length > 1 }
function add(node, kind) {
  feed.insertBefore(node, typing)
  lastKind = kind
  if (kind !== 'steps') stepsBox = null
  updateWelcome(); atEnd()
}
function clearFeed() {
  ;[...feed.children].forEach(c => { if (c !== typing) c.remove() })
  cards.clear(); lastKind = null; stepsBox = null
  refreshPending(); updateWelcome()
}
function message(role, text, files = []) {
  const row = el('div', 'bubble-row' + (role === 'user' ? ' user' : ''))
  if (role !== 'user') {
    if (lastKind === 'assistant') row.append(el('div', 'spacer'))
    else { const a = el('span', 'orb static'); a.innerHTML = ORB; row.append(a) }
  }
  const bubble = el('div', 'msg', text)
  for (const f of files) {
    const line = el('div', 'fileline'); line.insertAdjacentHTML('afterbegin', icon('file')); line.append(el('span', '', f.name))
    bubble.append(line)
  }
  row.append(bubble)
  add(row, role === 'user' ? 'user' : 'assistant')
}
function step(name) {
  const label = t('step_' + name)
  if (!stepsBox) {
    const box = el('details', 'steps')
    const sum = el('summary'); sum.insertAdjacentHTML('afterbegin', icon(/_file|command/.test(name) ? 'terminal' : 'globe')); sum.append(el('span', 'now'))
    box.append(sum, el('ul'))
    box.count = 0
    add(box, 'steps'); stepsBox = box
  }
  stepsBox.count += 1
  stepsBox.querySelector('ul').append(el('li', '', label))
  stepsBox.querySelector('.now').textContent = `${label} · ${t('stepsCount', stepsBox.count)}`
  lastKind = 'steps'
  atEnd()
}
function notice(text, err) { add(el('div', 'notice' + (err ? ' err' : ''), text), 'notice') }

// ---- cards ----
const ACTIONS = { command:'actCommand', read:'actRead', list:'actList', write:'actWrite' }
function buildCard(e, kind, pendingCopy = false) {
  const c = el('div', 'card ' + (kind === 'approval' ? 'ask' : 'help'))
  const top = el('div', 'card-top')
  const ic = el('span', 'chipicon'); ic.innerHTML = icon(kind === 'takeover' ? 'hand' : e.kind === 'command' ? 'terminal' : 'shield')
  top.append(ic, el('span', 'tag', t(kind === 'approval' ? 'tagApprove' : 'tagHelp')),
    el('span', 'time', new Date(e.at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })))
  c.append(top, el('div', 'lead', t(kind === 'approval' ? 'needsApproval' : 'needsYou')))
  if (kind === 'takeover') c.append(el('div', 'what', e.reason))
  else if (e.kind === 'command') c.append(el('div', 'what', t('actCommand')), el('div', 'where', t('inFolder', e.target)))
  else if (ACTIONS[e.kind]) c.append(el('div', 'what', `${t(ACTIONS[e.kind])}: ${e.target}`))
  else c.append(el('div', 'what', e.summary))
  if (e.detail) c.append(el('pre', 'detail', e.detail))
  if (e.screenshot) { const img = new Image(); img.alt = ''; img.src = 'data:image/jpeg;base64,' + e.screenshot; c.append(img) }
  const row = el('div', 'actions')
  if (kind === 'approval') {
    const go = async allow => {
      const { status } = await post('/api/approve', { id: e.id, allow })
      if (status === 404) closeCard(e.id, t('expired'), false)
    }
    const no = el('button', 'btn', t('reject')); no.onclick = () => go(false)
    const yes = el('button', 'btn primary', t('allow')); yes.onclick = () => go(true)
    row.append(no, yes)
  } else {
    const openBtn = el('button', 'btn primary', t('openWindow')); openBtn.onclick = openBrowser
    row.append(openBtn)
  }
  c.append(row)
  const list = cards.get(e.id) ?? []
  list.push({ c, row, pending: pendingCopy }); cards.set(e.id, list)
  return c
}
function closeCard(id, label, ok = true) {
  open.delete(id)
  for (const { c, row } of cards.get(id) ?? []) {
    row.className = 'done' + (ok ? '' : ' no')
    row.innerHTML = ''
    row.insertAdjacentHTML('afterbegin', icon(ok ? 'tick' : 'cross'))
    row.append(el('span', '', label))
    c.querySelector('img')?.remove()
  }
  refreshPending()
}
function refreshPending() {
  const list = $('pendingList')
  list.textContent = ''
  for (const [id, entries] of cards) cards.set(id, entries.filter(x => !x.pending))
  for (const [, item] of open) list.append(buildCard(item.e, item.kind, true))
  $('pendingEmpty').hidden = open.size > 0
  $('badge').hidden = open.size === 0
  $('badge').textContent = open.size
}

// ---- live events from the server ----
let activeTakeover = null
function track(e) { // approvals and takeovers belong to every conversation, because the browser and server are shared
  if (e.type === 'approval' || e.type === 'takeover') {
    open.set(e.id, { e, kind: e.type })
    if (e.type === 'takeover') { activeTakeover = e.id; $('handBack').hidden = false }
    refreshPending()
  } else if (e.type === 'approval_done' || e.type === 'takeover_done') {
    open.delete(e.id)
    if (e.type === 'takeover_done' && activeTakeover === e.id) { activeTakeover = null; $('handBack').hidden = true }
    refreshPending()
  }
}
function render(e) {
  if (e.type === 'message') message(e.role, e.text, e.files ?? [])
  else if (e.type === 'step') step(e.name)
  else if (e.type === 'error') notice(e.text, true)
  else if (e.type === 'notice') notice(t(e.code === 'BUDGET_NEAR' ? 'budgetNear' : 'budgetExceeded'), true)
  else if (e.type === 'approval' || e.type === 'takeover') {
    add(buildCard(e, e.type), 'card')
    if (!open.has(e.id)) closeCard(e.id, t('expired'), false) // an old request nobody can answer any more
  }
  else if (e.type === 'approval_done') closeCard(e.id, t(e.allowed ? 'approved' : 'rejected'), e.allowed)
  else if (e.type === 'takeover_done') closeCard(e.id, t('doneTakeover'))
}
function route(e) {
  track(e)
  if (e.cid !== activeCid) return
  render(e)
  if (e.type === 'message' && e.role === 'assistant') speak(e.text)
}

function showBudget(b) {
  const pct = Math.min(100, (b.spentUsd / b.capUsd) * 100)
  const level = b.exceeded ? 'over' : b.near ? 'warn' : ''
  $('drawerSpend').textContent = `${t('spendLabel')}  $${b.spentUsd.toFixed(3)} / $${b.capUsd}`
  $('spentBig').innerHTML = ''
  $('spentBig').append(`$${b.spentUsd.toFixed(3)} `, el('small', '', `/ $${b.capUsd}`))
  $('capBar').className = 'bar ' + level
  $('capBar').firstElementChild.style.width = pct + '%'
  if (document.activeElement !== $('cap')) $('cap').value = b.capUsd
}

// ---- conversations and the history drawer ----
let convs = []
let convTimer
const refreshConvs = () => { clearTimeout(convTimer); convTimer = setTimeout(loadConvs, 150) }
async function loadConvs() {
  const res = await fetch('/api/conversations')
  if (!res.ok) return
  const data = await res.json()
  convs = data.items; runningCid = data.running
  drawConvs(); refreshOrb()
}
async function loadHistory(cid) {
  const res = await fetch('/api/conversations/' + encodeURIComponent(cid))
  if (activeCid !== cid) return false
  if (!res.ok) return false
  const { events } = await res.json()
  if (activeCid !== cid) return false
  clearFeed()
  events.forEach(render)
  refreshOrb(); updateWelcome(); atEnd()
  return true
}
async function selectConv(cid) {
  activeCid = cid
  closeDrawer(); show('chat'); clearFeed(); drawConvs(); refreshOrb()
  if (!await loadHistory(cid) && activeCid === cid) { activeCid = null; drawConvs(); refreshOrb() }
}
function newChat() {
  activeCid = null
  closeDrawer(); show('chat'); clearFeed(); drawConvs(); refreshOrb()
  $('text').focus()
}
function fmtTime(ts) {
  const d = new Date(ts)
  return d.toDateString() === new Date().toDateString()
    ? d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
    : d.toLocaleDateString([], { month: 'short', day: 'numeric' })
}
const REVEAL = 76
const closeRows = except => document.querySelectorAll('.conv.open').forEach(r => { if (r !== except) r.classList.remove('open') })
function drawConvs() {
  const ul = $('convList')
  ul.textContent = ''
  if (!convs.length) { ul.append(el('li', 'conv empty-row', t('noChats'))); return }
  for (const c of convs) ul.append(convRow(c))
}
function convRow(c) {
  const li = el('li', 'conv' + (c.id === activeCid ? ' active' : ''))
  const del = el('button', 'conv-del'); del.type = 'button'; del.innerHTML = icon('cross')
  del.setAttribute('aria-label', t('delChat')); del.title = t('delChat')
  const main = el('button', 'conv-main'); main.type = 'button'
  main.append(el('span', 'ct', c.title || t('newChat')),
    el('span', 'cs', fmtTime(c.updatedAt) + (c.id === runningCid ? ' · ' + t('stateThink') : '')))
  del.onclick = () => deleteConv(c.id, li)
  swipe(li, main, () => selectConv(c.id))
  li.append(del, main)
  return li
}
// Swipe a row left to reveal the red cross. Works with touch and mouse; the delete button is also reachable with the keyboard.
function swipe(li, main, onTap) {
  let startX = 0, startY = 0, base = 0, id = null, dragging = false, moved = false
  main.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return
    id = e.pointerId; startX = e.clientX; startY = e.clientY; dragging = false; moved = false
    base = li.classList.contains('open') ? -REVEAL : 0
  })
  main.addEventListener('pointermove', e => {
    if (id !== e.pointerId) return
    const dx = e.clientX - startX, dy = e.clientY - startY
    if (!dragging) {
      if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy) * 1.2) { dragging = true; main.setPointerCapture(e.pointerId); closeRows(li); main.style.transition = 'none' }
      else return
    }
    moved = true
    main.style.transform = `translateX(${Math.max(-REVEAL, Math.min(0, base + dx))}px)`
  })
  const finish = e => {
    if (id !== e.pointerId) return
    id = null
    if (!dragging) return
    const x = new DOMMatrix(getComputedStyle(main).transform).m41
    main.style.transition = ''; main.style.transform = ''
    li.classList.toggle('open', x < -REVEAL / 2)
  }
  main.addEventListener('pointerup', finish)
  main.addEventListener('pointercancel', finish)
  main.addEventListener('click', () => {
    if (moved) { moved = false; return }
    if (li.classList.contains('open')) { li.classList.remove('open'); return }
    onTap()
  })
}
async function deleteConv(id, li) {
  $('convMsg').textContent = ''
  const { status } = await post('/api/conversations/delete', { id })
  if (status === 409) { $('convMsg').textContent = t('cantDelete'); li.classList.remove('open'); return }
  if (status !== 200 && status !== 404) { $('convMsg').textContent = t('failed') + status; return }
  convs = convs.filter(c => c.id !== id)
  li.classList.add('gone')
  setTimeout(drawConvs, 200)
  if (activeCid === id) { activeCid = null; clearFeed(); refreshOrb() }
}
function openDrawer() {
  closeRows()
  $('convMsg').textContent = ''
  $('drawer').inert = false
  $('drawer').classList.add('open'); $('scrim').classList.add('on')
  loadConvs()
}
function closeDrawer() {
  $('drawer').classList.remove('open'); $('scrim').classList.remove('on')
  $('drawer').inert = true
}
$('drawer').inert = true
$('menuBtn').onclick = openDrawer
$('closeDrawer').onclick = closeDrawer
$('scrim').onclick = closeDrawer
$('newChat').onclick = newChat
$('drawerSpend').onclick = () => { closeDrawer(); show('settings') }

let source
function connect() {
  source?.close()
  source = new EventSource('/api/events')
  source.onmessage = async m => {
    const e = JSON.parse(m.data)
    if (e.type === 'hello') {
      open.clear()
      for (const p of e.pending) open.set(p.id, { e: p, kind: p.type })
      activeTakeover = [...open.values()].find(x => x.kind === 'takeover')?.e.id ?? null
      $('handBack').hidden = !activeTakeover
      showBudget(e.budget); runningCid = e.running
      await loadConvs()
      if (activeCid === undefined) { if (convs.length) await selectConv(convs[0].id); else newChat() }
      else if (activeCid) await loadHistory(activeCid) // catch up after a dropped connection
      else refreshPending()
    }
    else if (e.type === 'conversations') refreshConvs()
    else if (e.type === 'budget') showBudget(e)
    else if (e.type === 'status') {
      if (e.status === 'running') runningCid = e.cid
      else if (runningCid === e.cid) runningCid = null
      refreshOrb()
      if (!$('drawer').inert) drawConvs()
    }
    else route(e)
  }
}

;[['chip1', 'chip1q'], ['chip2', 'chip2q']].forEach(([label, prompt]) => {
  const b = el('button', 'chip-btn', t(label)); b.type = 'button'
  b.onclick = () => { $('text').value = t(prompt); $('text').focus() }
  $('chips').append(b)
})

// ---- attachments (text files) ----
const MAX_FILES = 5, MAX_FILE_CHARS = 200000, MAX_TOTAL_CHARS = 500000
const TEXT_NAME = /\.(txt|md|markdown|csv|tsv|json|jsonl|log|xml|html?|ya?ml|ini|sql)$/i
let attachments = []
const kb = n => (n < 1024 ? n + ' B' : Math.round(n / 1024) + ' KB')
function drawAttachments() {
  const row = $('attachRow')
  row.textContent = ''
  row.hidden = attachments.length === 0 || $('composer').hidden
  attachments.forEach((f, i) => {
    const chip = el('span', 'file-chip')
    chip.insertAdjacentHTML('afterbegin', icon('file'))
    const x = el('button'); x.type = 'button'; x.title = t('remove'); x.setAttribute('aria-label', t('remove')); x.innerHTML = icon('cross')
    x.onclick = () => { attachments.splice(i, 1); drawAttachments() }
    chip.append(el('span', 'n', f.name), el('small', '', kb(f.text.length)), x)
    row.append(chip)
  })
}
async function readText(file) {
  const buf = await file.arrayBuffer()
  let text
  try { text = new TextDecoder('utf-8', { fatal: true }).decode(buf) }
  catch { try { text = new TextDecoder('gbk').decode(buf) } catch { return null } } // Excel in China often saves CSV as GBK
  return /\u0000/.test(text) ? null : text.replace(/^﻿/, '')
}
$('attachBtn').onclick = () => $('filePick').click()
$('filePick').onchange = async () => {
  const picked = [...$('filePick').files]
  $('filePick').value = ''
  for (const file of picked) {
    if (attachments.length >= MAX_FILES) { notice(t('filesMany'), true); break }
    if (!TEXT_NAME.test(file.name) && !file.type.startsWith('text/')) { notice(t('fileUnsupported', file.name), true); continue }
    if (file.size > MAX_FILE_CHARS * 4) { notice(t('fileBig', file.name), true); continue }
    const text = await readText(file)
    if (text === null) { notice(t('fileBinary', file.name), true); continue }
    if (text.length > MAX_FILE_CHARS) { notice(t('fileBig', file.name), true); continue }
    if (attachments.reduce((n, f) => n + f.text.length, 0) + text.length > MAX_TOTAL_CHARS) { notice(t('filesTotal'), true); continue }
    attachments.push({ name: file.name, text })
  }
  drawAttachments()
}
$('composer').onsubmit = async e => {
  e.preventDefault()
  const text = $('text').value.trim()
  if (!text && !attachments.length) return
  const files = attachments
  $('text').value = ''
  attachments = []; drawAttachments()
  const restore = () => { $('text').value = text; attachments = files; drawAttachments() } // keep the draft so nothing is lost
  if (!activeCid) {
    const made = await post('/api/conversations')
    if (made.status !== 200) { restore(); notice(errText(made.data, made.status), true); return }
    activeCid = made.data.id
  }
  const { status, data } = await post('/api/chat', { cid: activeCid, text, files })
  if (status === 200) { refreshConvs(); return }
  restore()
  if (data.error === 'NO_KEY') { $('settingsMsg').textContent = t('noKey'); show('settings') }
  else if (data.error === 'BUDGET_EXCEEDED') notice(t('budgetExceeded'), true)
  else if (data.error === 'BUSY_OTHER') notice(t('busyOther'), true)
  else notice(errText(data, status), true)
}

// ---- settings ----
let appState = {}, deepseekModels = []
const CUSTOM = '__custom'
function renderModelCard() {
  const sel = $('modelSel'), custom = sel.value === CUSTOM
  $('customBox').hidden = !custom
  const saved = appState.model ?? {}
  const has = (saved.kind === 'custom') === custom && appState.hasKey
  const ks = $('keyState')
  ks.className = 'keystate' + (has ? '' : ' none')
  ks.textContent = ''
  ks.insertAdjacentHTML('afterbegin', icon(has ? 'tick' : 'shield'))
  ks.append(el('span', '', t(has ? 'keySaved' : 'keyNone')))
  if (has && appState.keyHint) ks.append(el('code', '', appState.keyHint === 'env' ? t('keyEnv') : appState.keyHint))
  if (has && !custom && appState.keyHint !== 'env') {
    const b = el('button', 'link', t('replaceKey')); b.type = 'button'
    b.onclick = () => { $('key').hidden = false; $('key').focus(); b.remove() }
    ks.append(b)
  }
  $('key').hidden = custom || has
}
async function loadModelCard() {
  appState = await (await fetch('/api/state')).json()
  try { deepseekModels = (await post('/api/models')).data.deepseek ?? [] } catch { deepseekModels = [] }
  const sel = $('modelSel'), saved = appState.model ?? {}
  sel.textContent = ''
  const ids = saved.kind === 'deepseek' && !deepseekModels.includes(saved.model) ? [saved.model, ...deepseekModels] : deepseekModels
  for (const id of ids) sel.append(new Option('DeepSeek · ' + id, id))
  sel.append(new Option(t('otherModel'), CUSTOM))
  sel.value = saved.kind === 'custom' ? CUSTOM : saved.model
  if (saved.kind === 'custom') {
    $('cEndpoint').value = saved.baseUrl ?? ''; $('cModel').value = saved.model ?? ''
    $('cIn').value = saved.inputUsd ?? ''; $('cOut').value = saved.outputUsd ?? ''
  }
  renderModelCard()
}
$('modelSel').onchange = renderModelCard
$('saveModel').onclick = async () => {
  const custom = $('modelSel').value === CUSTOM
  const body = custom
    ? { kind: 'custom', baseUrl: $('cEndpoint').value, model: $('cModel').value, key: $('cKey').value, inputUsd: $('cIn').value, outputUsd: $('cOut').value }
    : { kind: 'deepseek', model: $('modelSel').value, key: $('key').value }
  const { status, data } = await post('/api/model', body)
  if (status === 200) {
    $('key').value = ''; $('cKey').value = ''
    await loadModelCard()
    $('settingsMsg').textContent = t('saved')
  } else $('settingsMsg').textContent = errText(data, status)
}
$('saveCap').onclick = async () => {
  const { status, data } = await post('/api/budget', { capUsd: Number($('cap').value) })
  $('settingsMsg').textContent = status === 200 ? t('saved') : t('failed') + (data.error ?? status)
}
$('logout').onclick = async () => { await post('/api/logout'); location.reload() }

// ---- phone browser window ----
const canvas = $('screen'), ctx = canvas.getContext('2d')
let ws, moveQueued = null
const sendWs = m => { if (ws?.readyState === 1) ws.send(JSON.stringify(m)) }
function openBrowser() {
  $('browser').hidden = false
  const area = $('stage').getBoundingClientRect()
  const w = Math.floor(area.width), h = Math.floor(area.height)
  canvas.style.width = w + 'px'; canvas.style.height = h + 'px'
  ws = new WebSocket(location.origin.replace(/^http/, 'ws') + '/ws/browser')
  ws.binaryType = 'blob'
  ws.onopen = () => sendWs({ t:'viewport', w, h })
  ws.onmessage = async m => {
    if (typeof m.data === 'string') { const e = JSON.parse(m.data); if (e.error) notice(e.error, true); return }
    const bmp = await createImageBitmap(m.data)
    if (canvas.width !== bmp.width || canvas.height !== bmp.height) { canvas.width = bmp.width; canvas.height = bmp.height }
    ctx.drawImage(bmp, 0, 0); bmp.close()
  }
}
function closeBrowser() { ws?.close(); ws = null; $('browser').hidden = true }
$('openBrowser').onclick = openBrowser
$('closeBrowser').onclick = closeBrowser
$('handBack').onclick = async () => {
  const id = activeTakeover
  closeBrowser()
  await post('/api/takeover/done')
  if (id) { closeCard(id, t('doneTakeover')); activeTakeover = null; $('handBack').hidden = true }
}
const point = e => {
  const r = canvas.getBoundingClientRect()
  return { x: Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), y: Math.min(1, Math.max(0, (e.clientY - r.top) / r.height)) }
}
canvas.onpointerdown = e => { canvas.setPointerCapture(e.pointerId); sendWs({ t:'pointer', k:'down', ...point(e) }) }
canvas.onpointermove = e => {
  if (!e.buttons) return
  const first = moveQueued === null
  moveQueued = point(e)
  if (first) requestAnimationFrame(() => { sendWs({ t:'pointer', k:'move', ...moveQueued }); moveQueued = null })
}
canvas.onpointerup = e => sendWs({ t:'pointer', k:'up', ...point(e) })
canvas.onwheel = e => { e.preventDefault(); sendWs({ t:'wheel', d:e.deltaY }) }
const scrollStep = () => Math.round($('stage').clientHeight * .7)
$('scrollUp').onclick = () => sendWs({ t:'wheel', d:-scrollStep() })
$('scrollDown').onclick = () => sendWs({ t:'wheel', d:scrollStep() })
$('navForm').onsubmit = e => { e.preventDefault(); if ($('url').value.trim()) sendWs({ t:'nav', url:$('url').value.trim() }) }
$('fillBtn').onclick = () => { if ($('fill').value) { sendWs({ t:'text', v:$('fill').value }); $('fill').value = '' } }
$('enterBtn').onclick = () => sendWs({ t:'key', k:'Enter' })
$('backBtn').onclick = () => sendWs({ t:'key', k:'Backspace' })
$('togglePw').onclick = () => {
  const f = $('fill'), hide = f.type !== 'password'
  f.type = hide ? 'password' : 'text'
  $('togglePw').innerHTML = icon(hide ? 'eyeoff' : 'eye')
}

async function boot() {
  const s = await (await fetch('/api/state')).json()
  $('login').hidden = s.authed
  $('app').hidden = !s.authed
  if (!s.authed) { if (!s.pinSet) $('loginMsg').textContent = t('noPin'); return }
  appState = s
  show('chat'); refreshOrb()
  if (!s.hasKey) { $('settingsMsg').textContent = t('noKey'); show('settings') }
  connect()
}
boot()
